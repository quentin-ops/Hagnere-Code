<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kit cahier des charges d'une application métier</title>
  <desc id="desc">Modèle Word, exemple rempli et mode d'emploi gratuits.</desc>
  <defs>
