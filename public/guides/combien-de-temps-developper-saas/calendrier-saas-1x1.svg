<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Quatre portes avant un calendrier SaaS candidat</title>
  <desc id="desc">Le planificateur s’arrête si les entrées manquent ou si le réseau est invalide, demande une clarification si la capacité est partagée, puis produit seulement un calendrier candidat à revoir.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b16"/>
      <stop offset="1" stop-color="#21123a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="900" fill="url(#bg)"/>
  <circle cx="770" cy="95" r="250" fill="#7c3aed" opacity="0.18"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="72" fill="#c4b5fd" font-size="17" font-weight="750" letter-spacing="2.4">PLANIFICATEUR LOCAL · AUCUN SCORE</text>
    <text x="64" y="126" fill="#ffffff" font-size="39" font-weight="770">Une porte échoue ?</text>
    <text x="64" y="172" fill="#ffffff" font-size="39" font-weight="770">Aucune date candidate.</text>

    <g fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
      <path d="M450 310V345"/>
      <path d="M450 461V496"/>
      <path d="M450 612V647"/>
    </g>

    <g filter="url(#shadow)">
      <g>
        <rect x="64" y="218" width="772" height="92" rx="23" fill="#31161b" stroke="#fb7185" stroke-width="2"/>
        <circle cx="112" cy="264" r="21" fill="#fb7185"/>
        <text x="112" y="271" text-anchor="middle" fill="#3f0b13" font-size="23" font-weight="900">!</text>
        <text x="151" y="253" fill="#fecdd3" font-size="17" font-weight="800">STOP_REQUIRED_INPUTS_UNKNOWN</text>
        <text x="151" y="282" fill="#ffffff" font-size="18">Ligne d’arrivée, responsable ou durée manquants</text>
      </g>
      <g>
        <rect x="64" y="369" width="772" height="92" rx="23" fill="#31161b" stroke="#f43f5e" stroke-width="2"/>
        <circle cx="112" cy="415" r="21" fill="#f43f5e"/>
        <text x="112" y="422" text-anchor="middle" fill="#3f0b13" font-size="23" font-weight="900">×</text>
        <text x="151" y="404" fill="#fecdd3" font-size="17" font-weight="800">STOP_INVALID_DEPENDENCY_NETWORK</text>
        <text x="151" y="433" fill="#ffffff" font-size="18">Dépendance inconnue, durée négative ou cycle</text>
      </g>
      <g>
        <rect x="64" y="520" width="772" height="92" rx="23" fill="#302510" stroke="#fbbf24" stroke-width="2"/>
        <circle cx="112" cy="566" r="21" fill="#fbbf24"/>
        <text x="112" y="573" text-anchor="middle" fill="#422006" font-size="21" font-weight="900">?</text>
        <text x="151" y="555" fill="#fde68a" font-size="17" font-weight="800">CLARIFY_CAPACITY_BEFORE_CALENDAR</text>
        <text x="151" y="584" fill="#ffffff" font-size="18">Même capacité, deux tâches, aucun ordre explicite</text>
      </g>
      <g>
        <rect x="64" y="671" width="772" height="112" rx="25" fill="#172c26" stroke="#34d399" stroke-width="3"/>
        <circle cx="112" cy="727" r="23" fill="#34d399"/>
        <path d="M101 727l8 8 16-19" fill="none" stroke="#052e24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="151" y="714" fill="#a7f3d0" font-size="17" font-weight="800">CALENDAR_CANDIDATE_FOR_REVIEW</text>
        <text x="151" y="744" fill="#ffffff" font-size="18">Fin relative calculée · réserve séparée</text>
        <text x="151" y="770" fill="#a7f3d0" font-size="16">Une personne décide encore de l’engagement.</text>
      </g>
    </g>

    <rect x="64" y="824" width="772" height="42" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="450" y="851" text-anchor="middle" fill="#cbd5e1" font-size="16" font-weight="700">Aucune date civile · aucun téléchargement · aucun score</text>
  </g>
</svg>
