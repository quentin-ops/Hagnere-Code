<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Quatre scénarios déterministes et une réserve séparée</title>
  <desc id="desc">Cas fictif RelaisPro avec scénarios favorable, central, prudent et stress combiné, chacun montrant la chaîne, la réserve et le total de revue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b16"/>
      <stop offset="1" stop-color="#21123a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1070" cy="90" r="300" fill="#7c3aed" opacity="0.16"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="78" fill="#c4b5fd" font-size="19" font-weight="750" letter-spacing="2.6">RELAISPRO · EXEMPLE ENTIÈREMENT FICTIF</text>
    <text x="72" y="138" fill="#ffffff" font-size="46" font-weight="760">Quatre scénarios, une réserve séparée</text>
    <text x="72" y="180" fill="#cbd5e1" font-size="22">Les hypothèses changent. Le réseau est rejoué. Aucun score ne compense une inconnue.</text>

    <g filter="url(#shadow)">
      <g>
        <rect x="72" y="234" width="500" height="210" rx="28" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
        <rect x="72" y="234" width="11" height="210" rx="6" fill="#38bdf8"/>
        <text x="112" y="282" fill="#7dd3fc" font-size="19" font-weight="800">FAVORABLE</text>
        <text x="112" y="340" fill="#ffffff" font-size="42" font-weight="780">J+16</text>
        <text x="248" y="340" fill="#94a3b8" font-size="18">chaîne</text>
        <text x="112" y="382" fill="#cbd5e1" font-size="18">3 + 8 + 3 + 2</text>
        <text x="112" y="416" fill="#bae6fd" font-size="17">Réserve 4 à part · revue J+20</text>
      </g>
      <g>
        <rect x="628" y="234" width="500" height="210" rx="28" fill="#17153a" stroke="#818cf8" stroke-width="3"/>
        <rect x="628" y="234" width="11" height="210" rx="6" fill="#818cf8"/>
        <text x="668" y="282" fill="#a5b4fc" font-size="19" font-weight="800">CENTRAL</text>
        <text x="668" y="340" fill="#ffffff" font-size="42" font-weight="780">J+25</text>
        <text x="804" y="340" fill="#94a3b8" font-size="18">chaîne</text>
        <text x="668" y="382" fill="#cbd5e1" font-size="18">5 + 12 + 5 + 3</text>
        <text x="668" y="416" fill="#c7d2fe" font-size="17">Réserve 4 à part · revue J+29</text>
      </g>
      <g>
        <rect x="72" y="486" width="500" height="210" rx="28" fill="#1c1737" stroke="#c084fc" stroke-width="2"/>
        <rect x="72" y="486" width="11" height="210" rx="6" fill="#c084fc"/>
        <text x="112" y="534" fill="#d8b4fe" font-size="19" font-weight="800">PRUDENT</text>
        <text x="112" y="592" fill="#ffffff" font-size="42" font-weight="780">J+37</text>
        <text x="248" y="592" fill="#94a3b8" font-size="18">chaîne</text>
        <text x="112" y="634" fill="#cbd5e1" font-size="18">7 + 17 + 8 + 5</text>
        <text x="112" y="668" fill="#e9d5ff" font-size="17">Réserve 4 à part · revue J+41</text>
      </g>
      <g>
        <rect x="628" y="486" width="500" height="210" rx="28" fill="#2b152e" stroke="#fb7185" stroke-width="3"/>
        <rect x="628" y="486" width="11" height="210" rx="6" fill="#fb7185"/>
        <text x="668" y="534" fill="#fda4af" font-size="19" font-weight="800">STRESS COMBINÉ</text>
        <text x="668" y="592" fill="#ffffff" font-size="42" font-weight="780">J+47</text>
        <text x="804" y="592" fill="#94a3b8" font-size="18">chaîne</text>
        <text x="668" y="634" fill="#cbd5e1" font-size="18">12 + 17 + 13 + 5</text>
        <text x="668" y="668" fill="#fecdd3" font-size="17">Réserve 4 à part · revue J+51</text>
      </g>
    </g>

    <rect x="72" y="750" width="1056" height="92" rx="24" fill="#0f172a" stroke="#475569"/>
    <rect x="93" y="772" width="172" height="48" rx="15" fill="url(#accent)"/>
    <text x="179" y="803" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="800">RÉSERVE · 4 J</text>
    <text x="297" y="790" fill="#e2e8f0" font-size="19" font-weight="700">Toujours visible, jamais fondue dans les tâches.</text>
    <text x="297" y="818" fill="#94a3b8" font-size="17">Le stress externe + interne change la chaîne déterminante.</text>
    <text x="925" y="789" text-anchor="middle" fill="#fbbf24" font-size="17" font-weight="800">AUCUNE PROBABILITÉ</text>
    <text x="925" y="818" text-anchor="middle" fill="#fde68a" font-size="16">Décision humaine requise</text>
  </g>
</svg>
