<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Réseau de dépendances d’un calendrier SaaS fictif</title>
  <desc id="desc">Deux départs rejoignent un parcours construit, une branche support avance en parallèle, puis la recette et l’ouverture forment la chaîne déterminante.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a13"/>
      <stop offset="0.58" stop-color="#12172a"/>
      <stop offset="1" stop-color="#24123f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.72">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g opacity="0.1" stroke="#cbd5e1">
    <path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600M0 840H1600"/>
    <path d="M120 0V900M320 0V900M520 0V900M720 0V900M920 0V900M1120 0V900M1320 0V900M1520 0V900"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="92" y="92" fill="#c4b5fd" font-size="21" font-weight="700" letter-spacing="3">CALENDRIER RELATIF · EXEMPLE ENTIÈREMENT FICTIF</text>
    <text x="92" y="158" fill="#ffffff" font-size="52" font-weight="760">La chaîne la plus longue fixe la fin candidate</text>
    <text x="92" y="204" fill="#cbd5e1" font-size="24">Les branches parallèles ne sont pas additionnées. Les jonctions attendent leur dernier prérequis.</text>

    <g fill="none" stroke-linecap="round" stroke-width="7">
      <path d="M342 355C430 355 438 420 518 420" stroke="#a78bfa" marker-end="url(#arrow)"/>
      <path d="M342 545C430 545 438 470 518 470" stroke="#64748b" stroke-dasharray="14 14" marker-end="url(#arrowMuted)"/>
      <path d="M782 445H892" stroke="#a78bfa" marker-end="url(#arrow)"/>
      <path d="M342 355C430 355 442 690 560 690H892" stroke="#64748b" marker-end="url(#arrowMuted)"/>
      <path d="M1146 540H1240" stroke="#a78bfa" marker-end="url(#arrow)"/>
    </g>

    <g filter="url(#shadow)">
      <g>
        <rect x="92" y="292" width="250" height="126" rx="24" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/>
        <circle cx="127" cy="328" r="14" fill="#a78bfa"/>
        <text x="157" y="336" fill="#ddd6fe" font-size="17" font-weight="750">PARCOURS</text>
        <text x="122" y="374" fill="#ffffff" font-size="21" font-weight="650">Critères décidés</text>
        <text x="122" y="401" fill="#a5b4fc" font-size="17">Central · 5 j</text>
      </g>
      <g>
        <rect x="92" y="482" width="250" height="126" rx="24" fill="#111827" stroke="#64748b" stroke-width="2"/>
        <circle cx="127" cy="518" r="14" fill="#64748b"/>
        <text x="157" y="526" fill="#cbd5e1" font-size="17" font-weight="750">ACCÈS TIERS</text>
        <text x="122" y="564" fill="#ffffff" font-size="21" font-weight="650">Accès de test</text>
        <text x="122" y="591" fill="#94a3b8" font-size="17">Central · 4 j</text>
      </g>
      <g>
        <rect x="518" y="365" width="264" height="160" rx="26" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/>
        <text x="550" y="407" fill="#c4b5fd" font-size="17" font-weight="750">JONCTION</text>
        <text x="550" y="449" fill="#ffffff" font-size="22" font-weight="680">Parcours construit</text>
        <text x="550" y="482" fill="#a5b4fc" font-size="17">Central · 12 j</text>
        <text x="550" y="509" fill="#94a3b8" font-size="15">Attend parcours + accès</text>
      </g>
      <g>
        <rect x="518" y="632" width="264" height="116" rx="24" fill="#111827" stroke="#64748b" stroke-width="2"/>
        <text x="550" y="673" fill="#cbd5e1" font-size="17" font-weight="750">BRANCHE PARALLÈLE</text>
        <text x="550" y="709" fill="#ffffff" font-size="21" font-weight="650">Support préparé · 6 j</text>
      </g>
      <g>
        <rect x="892" y="410" width="254" height="260" rx="28" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/>
        <text x="926" y="454" fill="#c4b5fd" font-size="17" font-weight="750">RECETTE</text>
        <text x="926" y="496" fill="#ffffff" font-size="23" font-weight="680">Contrôles acceptés</text>
        <text x="926" y="532" fill="#a5b4fc" font-size="17">Central · 5 j</text>
        <line x1="926" y1="558" x2="1112" y2="558" stroke="#4338ca" stroke-width="2"/>
        <text x="926" y="592" fill="#cbd5e1" font-size="16">Attend le parcours</text>
        <text x="926" y="618" fill="#cbd5e1" font-size="16">et le support</text>
        <text x="926" y="649" fill="#94a3b8" font-size="15">Capacité distincte</text>
      </g>
      <g>
        <rect x="1240" y="468" width="266" height="144" rx="26" fill="#4c1d95" stroke="#c4b5fd" stroke-width="3"/>
        <text x="1274" y="510" fill="#ddd6fe" font-size="17" font-weight="750">LIGNE D’ARRIVÉE</text>
        <text x="1274" y="552" fill="#ffffff" font-size="23" font-weight="700">Pilote ouvert</text>
        <text x="1274" y="586" fill="#c4b5fd" font-size="17">Central · 3 j</text>
      </g>
    </g>

    <g>
      <rect x="92" y="786" width="935" height="70" rx="20" fill="#0f172a" stroke="#312e81"/>
      <text x="124" y="830" fill="#e2e8f0" font-size="21">Chaîne centrale :</text>
      <text x="300" y="830" fill="#c4b5fd" font-size="21" font-weight="750">5 + 12 + 5 + 3 = 25 jours ouvrés</text>
      <text x="696" y="830" fill="#94a3b8" font-size="19">· réserve séparée 4 · revue J+29</text>
      <rect x="1051" y="786" width="455" height="70" rx="20" fill="#1c1917" stroke="#f59e0b"/>
      <text x="1084" y="816" fill="#fbbf24" font-size="16" font-weight="750">AUCUNE DURÉE UNIVERSELLE</text>
      <text x="1084" y="842" fill="#fde68a" font-size="17">Le réseau et la capacité doivent être revus.</text>
    </g>
  </g>
</svg>
