<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 675"
  role="img"
  aria-labelledby="title desc"
  font-family="Arial, sans-serif"
>
  <title id="title">Chaîne de garde du produit en huit vérifications</title>
  <desc id="desc">
    Huit vérifications relient les fonctions incluses à la reprise. Pour
    chacune, une personne agit, une seconde vérifie, une trace est conservée et
    un test volontaire cherche l’échec.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="1" stop-color="#312e81" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#020617"
        flood-opacity=".28"
      />
    </filter>
    <style>
      .txt {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .eyebrow {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 2px;
        fill: #c7d2fe;
      }
      .heading {
        font-size: 40px;
        font-weight: 750;
        fill: #fff;
      }
      .sub {
        font-size: 19px;
        fill: #dbeafe;
      }
      .number {
        font-size: 20px;
        font-weight: 800;
        fill: #1e1b4b;
      }
      .label {
        font-size: 18px;
        font-weight: 750;
        fill: #111827;
      }
      .note {
        font-size: 14px;
        fill: #374151;
      }
      .footer {
        font-size: 18px;
        font-weight: 650;
        fill: #fff;
      }
    </style>
  </defs>
  <rect width="1200" height="675" rx="34" fill="#111827" />
  <circle cx="1080" cy="85" r="155" fill="#6366f1" opacity=".16" />
  <circle cx="120" cy="640" r="180" fill="#22d3ee" opacity=".09" />
  <text
    class="txt eyebrow"
    x="68"
    y="70"
    font-size="18"
    font-weight="700"
    fill="#c7d2fe"
  >
    MÉTHODE NON TESTÉE ICI
  </text>
  <text
    class="txt heading"
    x="68"
    y="120"
    font-size="40"
    font-weight="700"
    fill="#ffffff"
  >
    La chaîne de garde du produit
  </text>
  <text class="txt sub" x="68" y="156" font-size="19" fill="#dbeafe">
    Une autre personne doit pouvoir reprendre sans le créateur
  </text>

  <path
    d="M118 253 H1082 M1082 253 V447 M1082 447 H118"
    fill="none"
    stroke="#a5b4fc"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="3 14"
    opacity=".7"
  />

  <g filter="url(#shadow)">
    <g transform="translate(66 205)" fill="#111827">
      <rect width="252" height="116" rx="20" fill="#fff" />
      <circle cx="38" cy="36" r="22" fill="#c7d2fe" />
      <text
        class="txt number"
        x="31"
        y="43"
        font-size="20"
        font-weight="800"
        fill="#1e1b4b"
      >
        1
      </text>
      <text
        class="txt label"
        x="72"
        y="42"
        font-size="18"
        font-weight="700"
        fill="#111827"
      >
        Ce qui est inclus
      </text>
      <text class="txt note" x="24" y="78" font-size="14" fill="#374151">
        Version, exclusions et jeu fictif
      </text>
      <text class="txt note" x="24" y="99" font-size="14" fill="#374151">
        avec responsable nommé
      </text>
    </g>
    <g transform="translate(338 205)" fill="#111827">
      <rect width="252" height="116" rx="20" fill="#fff" />
      <circle cx="38" cy="36" r="22" fill="#bae6fd" />
      <text
        class="txt number"
        x="31"
        y="43"
        font-size="20"
        font-weight="800"
        fill="#1e1b4b"
      >
        2
      </text>
      <text
        class="txt label"
        x="72"
        y="42"
        font-size="18"
        font-weight="700"
        fill="#111827"
      >
        Code
      </text>
      <text class="txt note" x="24" y="78" font-size="14" fill="#374151">
        Dépôt ou ZIP, dépendances
      </text>
      <text class="txt note" x="24" y="99" font-size="14" fill="#374151">
        et reconstruction vierge
      </text>
    </g>
    <g transform="translate(610 205)" fill="#111827">
      <rect width="252" height="116" rx="20" fill="#fff" />
      <circle cx="38" cy="36" r="22" fill="#bbf7d0" />
      <text
        class="txt number"
        x="31"
        y="43"
        font-size="20"
        font-weight="800"
        fill="#1e1b4b"
      >
        3
      </text>
      <text
        class="txt label"
        x="72"
        y="42"
        font-size="18"
        font-weight="700"
        fill="#111827"
      >
        Identités
      </text>
      <text class="txt note" x="24" y="78" font-size="14" fill="#374151">
        Deux comptes fictifs, rôles
      </text>
      <text class="txt note" x="24" y="99" font-size="14" fill="#374151">
        et tentative d’accès croisé
      </text>
    </g>
    <g transform="translate(882 205)" fill="#111827">
      <rect width="252" height="116" rx="20" fill="#fff" />
      <circle cx="38" cy="36" r="22" fill="#fde68a" />
      <text
        class="txt number"
        x="31"
        y="43"
        font-size="20"
        font-weight="800"
        fill="#1e1b4b"
      >
        4
      </text>
      <text
        class="txt label"
        x="72"
        y="42"
        font-size="18"
        font-weight="700"
        fill="#111827"
      >
        Déploiement
      </text>
      <text class="txt note" x="24" y="78" font-size="14" fill="#374151">
        Compte, commit, domaine
      </text>
      <text class="txt note" x="24" y="99" font-size="14" fill="#374151">
        et retrait d’une version
      </text>
    </g>
    <g transform="translate(882 389)" fill="#111827">
      <rect width="252" height="116" rx="20" fill="#fff" />
      <circle cx="38" cy="36" r="22" fill="#fed7aa" />
      <text
        class="txt number"
        x="31"
        y="43"
        font-size="20"
        font-weight="800"
        fill="#1e1b4b"
      >
        5
      </text>
      <text
        class="txt label"
        x="72"
        y="42"
        font-size="18"
        font-weight="700"
        fill="#111827"
      >
        Données
      </text>
      <text class="txt note" x="24" y="78" font-size="14" fill="#374151">
        Exports distincts, cible vierge
      </text>
      <text class="txt note" x="24" y="99" font-size="14" fill="#374151">
        et restauration observée
      </text>
    </g>
    <g transform="translate(610 389)" fill="#111827">
      <rect width="252" height="116" rx="20" fill="#fff" />
      <circle cx="38" cy="36" r="22" fill="#fecdd3" />
      <text
        class="txt number"
        x="31"
        y="43"
        font-size="20"
        font-weight="800"
        fill="#1e1b4b"
      >
        6
      </text>
      <text
        class="txt label"
        x="72"
        y="42"
        font-size="18"
        font-weight="700"
        fill="#111827"
      >
        Secrets
      </text>
      <text class="txt note" x="24" y="78" font-size="14" fill="#374151">
        Propriétaire, portée, rotation
      </text>
      <text class="txt note" x="24" y="99" font-size="14" fill="#374151">
        et révocation sans Git
      </text>
    </g>
    <g transform="translate(338 389)" fill="#111827">
      <rect width="252" height="116" rx="20" fill="#fff" />
      <circle cx="38" cy="36" r="22" fill="#ddd6fe" />
      <text
        class="txt number"
        x="31"
        y="43"
        font-size="20"
        font-weight="800"
        fill="#1e1b4b"
      >
        7
      </text>
      <text
        class="txt label"
        x="72"
        y="42"
        font-size="18"
        font-weight="700"
        fill="#111827"
      >
        Erreur
      </text>
      <text class="txt note" x="24" y="78" font-size="14" fill="#374151">
        Journaux, message, alerte
      </text>
      <text class="txt note" x="24" y="99" font-size="14" fill="#374151">
        et responsable nommé
      </text>
    </g>
    <g transform="translate(66 389)" fill="#111827">
      <rect width="252" height="116" rx="20" fill="#fff" />
      <circle cx="38" cy="36" r="22" fill="#a7f3d0" />
      <text
        class="txt number"
        x="31"
        y="43"
        font-size="20"
        font-weight="800"
        fill="#1e1b4b"
      >
        8
      </text>
      <text
        class="txt label"
        x="72"
        y="42"
        font-size="18"
        font-weight="700"
        fill="#111827"
      >
        Retour &amp; relève
      </text>
      <text class="txt note" x="24" y="78" font-size="14" fill="#374151">
        Procédure rejouée par une
      </text>
      <text class="txt note" x="24" y="99" font-size="14" fill="#374151">
        autre personne, sans créateur
      </text>
    </g>
  </g>

  <rect
    x="68"
    y="558"
    width="1064"
    height="70"
    rx="18"
    fill="#0f172a"
    stroke="#818cf8"
    stroke-width="2"
  />
  <text
    class="txt footer"
    x="94"
    y="588"
    font-size="18"
    font-weight="700"
    fill="#ffffff"
  >
    Chaque vérification :
  </text>
  <text class="txt sub" x="276" y="588" font-size="19" fill="#dbeafe">
    responsable · seconde personne · trace · test d’échec · passage de relais
  </text>
  <text
    class="txt footer"
    x="94"
    y="613"
    font-size="18"
    font-weight="700"
    fill="#ffffff"
  >
    Une vérification en ÉCHEC ou INCONNU bloque la remise :
  </text>
  <text
    class="txt footer"
    x="684"
    y="613"
    font-size="18"
    font-weight="700"
    fill="#ffffff"
  >
    elle n’est jamais compensée.
  </text>
</svg>
