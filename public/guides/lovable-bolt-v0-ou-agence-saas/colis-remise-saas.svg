  <title id="title">Colis de remise d’un SaaS</title>
  <desc id="desc">
    Une boîte ouverte contient six pièces de reprise : dépôt, inventaire de
    données, comptes, déploiement, secrets sans valeur et procédure
    d’exploitation. Une seconde personne valide seulement après avoir rejoué les
    étapes.
  </desc>
