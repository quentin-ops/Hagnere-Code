<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chaîne de preuve d’une recette applicative</title>
  <desc id="desc">Un besoin métier devient un cas rejouable, un résultat et une preuve avant une décision humaine ou un arrêt.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1400" cy="80" r="300" fill="#2563eb" opacity=".13"/>
  <circle cx="130" cy="810" r="260" fill="#0891b2" opacity=".1"/>
  <path d="M0 690C330 610 470 830 810 730s510-40 790 70v100H0Z" fill="#020617" opacity=".35"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="110" y="116" fill="#67e8f9" font-size="22" font-weight="700" letter-spacing="5">PLAN DE RECETTE · APPLICATION MÉTIER</text>
    <text x="110" y="183" fill="#f8fafc" font-size="54" font-weight="800">La chaîne de preuve</text>
    <text x="110" y="226" fill="#aebbd0" font-size="25">Le taux global ne remplace aucun maillon critique.</text>

    <g filter="url(#shadow)">
      <rect x="110" y="330" width="270" height="210" rx="28" fill="#10233e" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="166" cy="388" r="25" fill="url(#cyan)"/>
      <text x="166" y="397" text-anchor="middle" fill="#07111f" font-size="22" font-weight="800">1</text>
      <text x="150" y="454" fill="#e0f2fe" font-size="24" font-weight="800">BESOIN MÉTIER</text>
      <text x="150" y="490" fill="#aebbd0" font-size="18">Règle · parcours · risque</text>

      <rect x="455" y="330" width="270" height="210" rx="28" fill="#152047" stroke="#818cf8" stroke-width="2"/>
      <circle cx="511" cy="388" r="25" fill="url(#indigo)"/>
      <text x="511" y="397" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">2</text>
      <text x="495" y="454" fill="#eef2ff" font-size="24" font-weight="800">CAS REJOUABLE</text>
      <text x="495" y="490" fill="#b9c2dd" font-size="18">Acteur · données · attendu</text>

      <rect x="800" y="330" width="270" height="210" rx="28" fill="#102a30" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="856" cy="388" r="25" fill="#2dd4bf"/>
      <text x="856" y="397" text-anchor="middle" fill="#062b2d" font-size="22" font-weight="800">3</text>
      <text x="840" y="454" fill="#ccfbf1" font-size="24" font-weight="800">PREUVE</text>
      <text x="840" y="490" fill="#a9c9c8" font-size="18">Obtenu · trace · version</text>

      <rect x="1145" y="330" width="345" height="210" rx="28" fill="#19233a" stroke="#f8fafc" stroke-width="2"/>
      <circle cx="1201" cy="388" r="25" fill="#f8fafc"/>
      <text x="1201" y="397" text-anchor="middle" fill="#0f172a" font-size="22" font-weight="800">4</text>
      <text x="1185" y="454" fill="#f8fafc" font-size="24" font-weight="800">DÉCISION HUMAINE</text>
      <text x="1185" y="490" fill="#bdc8d9" font-size="18">Périmètre · écarts · limites</text>
    </g>

    <path d="M390 435H438" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M735 435H783" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1080 435H1128" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

    <path d="M935 550v72c0 28 22 50 50 50h98" fill="none" stroke="#fb7185" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="1098" y="625" width="230" height="92" rx="22" fill="#391524" stroke="#fb7185" stroke-width="2"/>
    <text x="1213" y="664" text-anchor="middle" fill="#fecdd3" font-size="20" font-weight="800">STOP / CORRIGER</text>
    <text x="1213" y="692" text-anchor="middle" fill="#fda4af" font-size="15">maillon ou cas critique absent</text>

    <g transform="translate(110 660)">
      <rect width="650" height="82" rx="22" fill="#0c1b2d" stroke="#334155"/>
      <text x="32" y="34" fill="#f8fafc" font-size="18" font-weight="700">4 statuts conservés jusqu’au verdict</text>
      <text x="32" y="61" fill="#94a3b8" font-size="16">RÉUSSI · ÉCHOUÉ · BLOQUÉ · NON EXÉCUTÉ</text>
    </g>

    <text x="110" y="824" fill="#64748b" font-size="18">HAGNÉRÉ CODE · GUIDE POUR DIRIGEANTS</text>
  </g>
</svg>
