<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Chaîne de preuve d’un plan de recette</title>
  <desc id="desc">Le besoin métier est transformé en cas rejouable puis en preuve avant une décision humaine ou un arrêt.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#14203a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 11 5.5 0 11Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="url(#background)"/>
  <circle cx="1090" cy="80" r="260" fill="#2563eb" opacity=".13"/>
  <circle cx="90" cy="860" r="220" fill="#0891b2" opacity=".1"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="102" fill="#67e8f9" font-size="19" font-weight="700" letter-spacing="4">PLAN DE RECETTE · APPLICATION MÉTIER</text>
    <text x="80" y="160" fill="#f8fafc" font-size="46" font-weight="800">La chaîne de preuve</text>
    <text x="80" y="199" fill="#aebbd0" font-size="21">Aucun pourcentage ne répare un cas critique absent.</text>

    <g filter="url(#shadow)">
      <rect x="80" y="280" width="450" height="175" rx="26" fill="#10233e" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="132" cy="333" r="24" fill="#67e8f9"/>
      <text x="132" y="341" text-anchor="middle" fill="#07111f" font-size="20" font-weight="800">1</text>
      <text x="120" y="395" fill="#e0f2fe" font-size="24" font-weight="800">BESOIN MÉTIER</text>
      <text x="120" y="425" fill="#aebbd0" font-size="17">Règle · parcours · risque</text>

      <rect x="670" y="280" width="450" height="175" rx="26" fill="#17214a" stroke="#818cf8" stroke-width="2"/>
      <circle cx="722" cy="333" r="24" fill="#818cf8"/>
      <text x="722" y="341" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">2</text>
      <text x="710" y="395" fill="#eef2ff" font-size="24" font-weight="800">CAS REJOUABLE</text>
      <text x="710" y="425" fill="#b9c2dd" font-size="17">Acteur · données · attendu</text>

      <rect x="80" y="535" width="450" height="175" rx="26" fill="#102a30" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="132" cy="588" r="24" fill="#2dd4bf"/>
      <text x="132" y="596" text-anchor="middle" fill="#062b2d" font-size="20" font-weight="800">3</text>
      <text x="120" y="650" fill="#ccfbf1" font-size="24" font-weight="800">PREUVE</text>
      <text x="120" y="680" fill="#a9c9c8" font-size="17">Obtenu · trace · version</text>

      <rect x="670" y="535" width="450" height="175" rx="26" fill="#19233a" stroke="#f8fafc" stroke-width="2"/>
      <circle cx="722" cy="588" r="24" fill="#f8fafc"/>
      <text x="722" y="596" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800">4</text>
      <text x="710" y="650" fill="#f8fafc" font-size="24" font-weight="800">DÉCISION HUMAINE</text>
      <text x="710" y="680" fill="#bdc8d9" font-size="17">Périmètre · écarts · limites</text>
    </g>

    <path d="M545 367h105" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M895 470v44H315v2" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M545 622h105" fill="none" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

    <rect x="80" y="760" width="1040" height="76" rx="20" fill="#0c1b2d" stroke="#334155"/>
    <text x="112" y="790" fill="#f8fafc" font-size="17" font-weight="700">RÉUSSI · ÉCHOUÉ · BLOQUÉ · NON EXÉCUTÉ</text>
    <text x="112" y="816" fill="#94a3b8" font-size="15">Un maillon absent déclenche STOP / CORRIGER avant la décision.</text>
    <text x="1120" y="813" text-anchor="end" fill="#67e8f9" font-size="15" font-weight="700">HAGNÉRÉ CODE</text>
  </g>
</svg>
