<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Les quatre étapes d’une recette, de haut en bas</title>
  <desc id="desc">Compter les cas, chiffrer les jours, écrire les seuils, décider, avec un retour vers la correction si un cas critique n’a pas été joué.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#17223d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1000" height="1000" fill="url(#background)"/>
  <circle cx="930" cy="50" r="240" fill="#2563eb" opacity=".13"/>
  <circle cx="40" cy="960" r="220" fill="#0891b2" opacity=".1"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="78" fill="#67e8f9" font-size="16" font-weight="700" letter-spacing="3">PLAN DE RECETTE · APPLICATION MÉTIER</text>
    <text x="64" y="132" fill="#f8fafc" font-size="42" font-weight="800">Compter avant d’écrire</text>
    <text x="64" y="166" fill="#aebbd0" font-size="19">Prouver avant d’accepter.</text>

    <g filter="url(#shadow)">
      <rect x="64" y="228" width="872" height="126" rx="25" fill="#10233e" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="122" cy="291" r="25" fill="#67e8f9"/>
      <text x="122" y="300" text-anchor="middle" fill="#07111f" font-size="21" font-weight="800">1</text>
      <text x="172" y="282" fill="#e0f2fe" font-size="25" font-weight="800">COMPTER LES CAS</text>
      <text x="172" y="316" fill="#aebbd0" font-size="17">Parcours · règles · droits · flux</text>

      <rect x="64" y="405" width="872" height="126" rx="25" fill="#17214a" stroke="#818cf8" stroke-width="2"/>
      <circle cx="122" cy="468" r="25" fill="#818cf8"/>
      <text x="122" y="477" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">2</text>
      <text x="172" y="459" fill="#eef2ff" font-size="25" font-weight="800">CHIFFRER LES JOURS</text>
      <text x="172" y="493" fill="#b9c2dd" font-size="17">Écriture · exécution · rejeu</text>

      <rect x="64" y="582" width="872" height="126" rx="25" fill="#102a30" stroke="#2dd4bf" stroke-width="2"/>
      <circle cx="122" cy="645" r="25" fill="#2dd4bf"/>
      <text x="122" y="654" text-anchor="middle" fill="#062b2d" font-size="21" font-weight="800">3</text>
      <text x="172" y="636" fill="#ccfbf1" font-size="25" font-weight="800">ÉCRIRE LES SEUILS</text>
      <text x="172" y="670" fill="#a9c9c8" font-size="17">Seuil · assiette · fenêtre · qui mesure</text>

      <rect x="64" y="759" width="872" height="126" rx="25" fill="#19233a" stroke="#f8fafc" stroke-width="2"/>
      <circle cx="122" cy="822" r="25" fill="#f8fafc"/>
      <text x="122" y="831" text-anchor="middle" fill="#0f172a" font-size="21" font-weight="800">4</text>
      <text x="172" y="813" fill="#f8fafc" font-size="25" font-weight="800">DÉCIDER</text>
      <text x="172" y="847" fill="#bdc8d9" font-size="17">Décideur nommé · écarts · limites</text>
    </g>

    <path d="M500 362v31" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M500 539v31" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M500 716v31" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="64" y="918" width="872" height="50" rx="16" fill="#391524" stroke="#fb7185"/>
    <text x="92" y="949" fill="#fecdd3" font-size="16" font-weight="700">Un cas critique non joué renvoie à la correction</text>
    <text x="908" y="949" text-anchor="end" fill="#67e8f9" font-size="14" font-weight="700">HAGNÉRÉ CODE</text>
  </g>
</svg>
