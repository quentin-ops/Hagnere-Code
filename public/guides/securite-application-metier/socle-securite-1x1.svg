  <text x="678" y="746" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Dépendances</text>
  <text x="678" y="780" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="16">Jours depuis le correctif</text>

  <rect x="376" y="375" width="248" height="288" rx="54" fill="#F8FAFC" fill-opacity=".08" stroke="#E2E8F0" stroke-opacity=".27"/>
