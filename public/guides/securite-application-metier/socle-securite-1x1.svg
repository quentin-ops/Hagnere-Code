  <text x="80" y="746" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Compte témoin</text>
  <text x="80" y="780" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="16">Dix codes · aucun 200</text>

