  <text x="132" y="277" fill="#7DD3FC" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">MESURE 1</text>
  <text x="80" y="330" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Restauration</text>
  <text x="80" y="364" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="16">Durée · seuil DMIA</text>

  <rect x="650" y="234" width="298" height="168" rx="25" fill="#0A3038" stroke="#2DD4BF" stroke-opacity=".74"/>
  <circle cx="696" cy="279" r="19" fill="#2DD4BF" fill-opacity=".16" stroke="#2DD4BF"/>
