<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Les quatre mesures avant la mise en service</title>
  <desc id="desc">Schéma pédagogique présentant les quatre mesures à exécuter avant la mise en service — restauration, alerte, compte témoin et dépendances — avec le nombre que chacune rend et le seuil qui la tranche.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="30" x2="940" y2="970" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07162F"/>
      <stop offset=".56" stop-color="#171B3E"/>
      <stop offset="1" stop-color="#06343A"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#22D3EE" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="1000" rx="44" fill="url(#bg)"/>
  <circle cx="500" cy="513" r="430" fill="url(#halo)"/>
  <text x="64" y="78" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">AVANT LA MISE EN SERVICE</text>
  <text x="64" y="125" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Quatre mesures</text>
  <text x="64" y="160" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="19">Un nombre, un seuil, un écart chiffré</text>

