  <circle cx="696" cy="283" r="3.5" fill="#5EEAD4"/>
  <text x="730" y="277" fill="#5EEAD4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">MESURE 2</text>
  <text x="678" y="330" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Alerte</text>
  <text x="678" y="364" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="16">Minutes jusqu’à une personne</text>

