  <text x="500" y="612" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Quatre nombres</text>
  <text x="500" y="639" text-anchor="middle" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="14">un seuil · un écart · un montant</text>

  <rect x="110" y="866" width="780" height="67" rx="33.5" fill="#020617" fill-opacity=".52" stroke="#94A3B8" stroke-opacity=".25"/>
  <circle cx="152" cy="899" r="7" fill="#67E8F9"/>
  <text x="174" y="906" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Aucun score : un nombre et un seuil</text>
  <text x="850" y="906" text-anchor="end" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SCHÉMA</text>
