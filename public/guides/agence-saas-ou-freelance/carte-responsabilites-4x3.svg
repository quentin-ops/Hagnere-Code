<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Carte de responsabilités d'une phase SaaS</title>
  <desc id="description">Six lignes fictives sont contrôlées. Quatre ont les cinq champs renseignés et deux restent incomplètes. Quatre plus deux égale six.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafaf9"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#312e81" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="42" fill="url(#bg)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="78" y="104" fill="#4338ca" font-size="20" font-weight="700" letter-spacing="2.5">CONTRÔLE DE COMPLÉTUDE · EXEMPLE FICTIF</text>
    <text x="78" y="161" fill="#18181b" font-size="41" font-weight="750">Une ligne n'est complète que si les cinq</text>
    <text x="78" y="208" fill="#18181b" font-size="41" font-weight="750">champs sont renseignés.</text>

    <g transform="translate(78 270)" filter="url(#shadow)">
      <rect width="1044" height="425" rx="28" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
      <g transform="translate(30 30)" font-size="16">
        <g fill="#71717a" font-size="14" font-weight="700" letter-spacing="1">
          <text x="22" y="24">TRAVAIL</text>
          <text x="333" y="24" text-anchor="middle">DÉCIDER</text>
          <text x="465" y="24" text-anchor="middle">RÉALISER</text>
          <text x="597" y="24" text-anchor="middle">CONTRÔLER</text>
          <text x="729" y="24" text-anchor="middle">RELAYER</text>
          <text x="861" y="24" text-anchor="middle">REMETTRE</text>
        </g>
        <path d="M0 48H984" stroke="#e4e4e7" stroke-width="2"/>
        <g font-size="17" fill="#27272a">
          <text x="22" y="91">T-01 · règle d'accès</text>
          <text x="22" y="145">T-02 · écran métier</text>
          <text x="22" y="199">T-03 · mise en ligne</text>
          <text x="22" y="253">T-04 · surveillance</text>
          <text x="22" y="307">T-05 · assistance</text>
          <text x="22" y="361">T-06 · reprise</text>
        </g>
        <g fill="#059669">
          <circle cx="333" cy="84" r="14"/><circle cx="465" cy="84" r="14"/><circle cx="597" cy="84" r="14"/><circle cx="729" cy="84" r="14"/><circle cx="861" cy="84" r="14"/>
          <circle cx="333" cy="138" r="14"/><circle cx="465" cy="138" r="14"/><circle cx="597" cy="138" r="14"/><circle cx="729" cy="138" r="14"/><circle cx="861" cy="138" r="14"/>
          <circle cx="333" cy="192" r="14"/><circle cx="465" cy="192" r="14"/><circle cx="597" cy="192" r="14"/><circle cx="729" cy="192" r="14"/><circle cx="861" cy="192" r="14"/>
          <circle cx="333" cy="246" r="14"/><circle cx="465" cy="246" r="14"/><circle cx="597" cy="246" r="14"/><circle cx="729" cy="246" r="14"/><circle cx="861" cy="246" r="14"/>
          <circle cx="333" cy="300" r="14"/><circle cx="465" cy="300" r="14"/><circle cx="597" cy="300" r="14"/><circle cx="861" cy="300" r="14"/>
          <circle cx="333" cy="354" r="14"/><circle cx="465" cy="354" r="14"/><circle cx="597" cy="354" r="14"/><circle cx="729" cy="354" r="14"/>
        </g>
        <g fill="#dc2626">
          <circle cx="729" cy="300" r="14"/>
          <path d="M722 293l14 14m0-14l-14 14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="861" cy="354" r="14"/>
          <path d="M854 347l14 14m0-14l-14 14" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M326 84l5 5 9-11"/><path d="M458 84l5 5 9-11"/><path d="M590 84l5 5 9-11"/><path d="M722 84l5 5 9-11"/><path d="M854 84l5 5 9-11"/>
          <path d="M326 138l5 5 9-11"/><path d="M458 138l5 5 9-11"/><path d="M590 138l5 5 9-11"/><path d="M722 138l5 5 9-11"/><path d="M854 138l5 5 9-11"/>
          <path d="M326 192l5 5 9-11"/><path d="M458 192l5 5 9-11"/><path d="M590 192l5 5 9-11"/><path d="M722 192l5 5 9-11"/><path d="M854 192l5 5 9-11"/>
          <path d="M326 246l5 5 9-11"/><path d="M458 246l5 5 9-11"/><path d="M590 246l5 5 9-11"/><path d="M722 246l5 5 9-11"/><path d="M854 246l5 5 9-11"/>
          <path d="M326 300l5 5 9-11"/><path d="M458 300l5 5 9-11"/><path d="M590 300l5 5 9-11"/><path d="M854 300l5 5 9-11"/>
          <path d="M326 354l5 5 9-11"/><path d="M458 354l5 5 9-11"/><path d="M590 354l5 5 9-11"/><path d="M722 354l5 5 9-11"/>
        </g>
      </g>
    </g>

    <g transform="translate(78 748)">
      <rect width="1044" height="92" rx="24" fill="#18181b"/>
      <text x="35" y="57" fill="#ffffff" font-size="26" font-weight="700">6 − 4 = 2 lignes incomplètes</text>
      <text x="666" y="57" fill="#c4b5fd" font-size="24" font-weight="700">Contrôle : 4 + 2 = 6</text>
    </g>
  </g>
</svg>
