<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Trois centres de gravité à comparer</title>
  <desc id="desc">Airtable est associé aux objets et aux états, Notion à la connaissance et au contexte, l’application métier aux parcours et règles dédiés.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f4f4f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="105" font-size="26" font-weight="700" letter-spacing="3" fill="#4f46e5">CENTRE DE GRAVITÉ</text>
    <text x="80" y="165" font-size="45" font-weight="750" fill="#18181b">Trois systèmes, trois responsabilités</text>
    <g filter="url(#shadow)">
      <rect x="80" y="250" width="320" height="450" rx="30" fill="#ffffff" stroke="#d4d4d8"/>
      <circle cx="240" cy="345" r="62" fill="#fff7ed"/>
      <rect x="202" y="315" width="76" height="60" rx="10" fill="none" stroke="#f97316" stroke-width="7"/>
      <path d="M202 338h76M227 315v60M253 315v60" stroke="#f97316" stroke-width="5"/>
      <text x="240" y="455" text-anchor="middle" font-size="34" font-weight="750" fill="#18181b">Airtable</text>
      <text x="240" y="505" text-anchor="middle" font-size="23" fill="#52525b">Objets · états · vues</text>
      <text x="240" y="545" text-anchor="middle" font-size="23" fill="#52525b">Formulaires · flux</text>
      <rect x="118" y="605" width="244" height="48" rx="24" fill="#fff7ed"/>
      <text x="240" y="637" text-anchor="middle" font-size="19" font-weight="700" fill="#c2410c">Structurer le suivi</text>
      <rect x="440" y="250" width="320" height="450" rx="30" fill="#ffffff" stroke="#d4d4d8"/>
      <circle cx="600" cy="345" r="62" fill="#f4f4f5"/>
      <rect x="568" y="307" width="64" height="76" rx="7" fill="none" stroke="#27272a" stroke-width="7"/>
      <path d="M582 330h36M582 346h36M582 362h28" stroke="#27272a" stroke-width="5" stroke-linecap="round"/>
      <text x="600" y="455" text-anchor="middle" font-size="34" font-weight="750" fill="#18181b">Notion</text>
      <text x="600" y="505" text-anchor="middle" font-size="23" fill="#52525b">Pages · contexte · liens</text>
      <text x="600" y="545" text-anchor="middle" font-size="23" fill="#52525b">Écriture · collaboration</text>
      <rect x="478" y="605" width="244" height="48" rx="24" fill="#f4f4f5"/>
      <text x="600" y="637" text-anchor="middle" font-size="19" font-weight="700" fill="#3f3f46">Transmettre le savoir</text>
      <rect x="800" y="250" width="320" height="450" rx="30" fill="#4f46e5"/>
      <circle cx="960" cy="345" r="62" fill="#ffffff" opacity="0.17"/>
      <path d="M923 355h34l18-35 18 49 15-26h25" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="960" y="455" text-anchor="middle" font-size="31" font-weight="750" fill="#ffffff">Application métier</text>
      <text x="960" y="505" text-anchor="middle" font-size="23" fill="#e0e7ff">Parcours · règles · rôles</text>
      <text x="960" y="545" text-anchor="middle" font-size="23" fill="#e0e7ff">Exploitation · évolution</text>
      <rect x="838" y="605" width="244" height="48" rx="24" fill="#ffffff" opacity="0.16"/>
      <text x="960" y="637" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Concevoir le service</text>
    </g>
    <rect x="80" y="760" width="1040" height="78" rx="24" fill="#e0e7ff"/>
    <text x="600" y="810" text-anchor="middle" font-size="24" font-weight="700" fill="#3730a3">Le bon choix passe les cas difficiles et reste reprenable.</text>
  </g>
</svg>
