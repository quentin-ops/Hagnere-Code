<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">La sortie comme chaîne de responsabilités</title>
  <desc id="desc">Des cartes objets, données, droits, automatisations, recette et retour arrière entourent une sortie maîtrisée.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#fbfaf7"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312e81" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="500" cy="505" r="304" fill="none" stroke="#c7d2fe" stroke-width="4" stroke-dasharray="12 15"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="500" y="90" text-anchor="middle" font-size="25" font-weight="700" letter-spacing="3" fill="#4f46e5">RÉVERSIBILITÉ</text>
    <text x="500" y="145" text-anchor="middle" font-size="43" font-weight="750" fill="#18181b">La sortie se prouve</text>
    <g filter="url(#shadow)">
      <circle cx="500" cy="505" r="155" fill="#4f46e5"/>
      <text x="500" y="490" text-anchor="middle" font-size="35" font-weight="750" fill="#ffffff">Sortie</text>
      <text x="500" y="535" text-anchor="middle" font-size="35" font-weight="750" fill="#ffffff">maîtrisée</text>
      <rect x="95" y="250" width="235" height="110" rx="24" fill="#ffffff" stroke="#d4d4d8"/>
      <text x="212" y="296" text-anchor="middle" font-size="25" font-weight="700" fill="#18181b">Objets</text>
      <text x="212" y="330" text-anchor="middle" font-size="19" fill="#52525b">Périmètre · propriétaires</text>
      <rect x="665" y="250" width="240" height="110" rx="24" fill="#ffffff" stroke="#d4d4d8"/>
      <text x="785" y="296" text-anchor="middle" font-size="25" font-weight="700" fill="#18181b">Données</text>
      <text x="785" y="330" text-anchor="middle" font-size="19" fill="#52525b">Formats · relations · fichiers</text>
      <rect x="70" y="470" width="245" height="110" rx="24" fill="#ffffff" stroke="#d4d4d8"/>
      <text x="192" y="516" text-anchor="middle" font-size="25" font-weight="700" fill="#18181b">Droits</text>
      <text x="192" y="550" text-anchor="middle" font-size="19" fill="#52525b">Identités · rôles · accès</text>
      <rect x="685" y="470" width="245" height="110" rx="24" fill="#ffffff" stroke="#d4d4d8"/>
      <text x="807" y="516" text-anchor="middle" font-size="25" font-weight="700" fill="#18181b">Flux</text>
      <text x="807" y="550" text-anchor="middle" font-size="19" fill="#52525b">Automatisations · secrets</text>
      <rect x="95" y="690" width="235" height="110" rx="24" fill="#ffffff" stroke="#d4d4d8"/>
      <text x="212" y="736" text-anchor="middle" font-size="25" font-weight="700" fill="#18181b">Recette</text>
      <text x="212" y="770" text-anchor="middle" font-size="19" fill="#52525b">Tâches · exceptions · signes</text>
      <rect x="665" y="690" width="240" height="110" rx="24" fill="#ffffff" stroke="#d4d4d8"/>
      <text x="785" y="736" text-anchor="middle" font-size="25" font-weight="700" fill="#18181b">Retour</text>
      <text x="785" y="770" text-anchor="middle" font-size="19" fill="#52525b">Coexistence · restauration</text>
    </g>
    <path d="M334 337l90 85M666 337l-90 85M316 525h94M684 525h-94M334 713l90-85M666 713l-90-85" stroke="#818cf8" stroke-width="7" stroke-linecap="round"/>
    <rect x="180" y="865" width="640" height="72" rx="24" fill="#18181b"/>
    <text x="500" y="910" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">Une case inconnue suspend la bascule irréversible.</text>
  </g>
</svg>
