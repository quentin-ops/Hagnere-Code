<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Décider à partir des preuves du travail réel</title>
  <desc id="desc">Un chemin relie l’observation du travail aux preuves, puis aux choix conserver, renforcer, hybrider ou sortir.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#312e81" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="250" fill="#c7d2fe" opacity="0.32"/>
  <circle cx="130" cy="830" r="290" fill="#ddd6fe" opacity="0.25"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="120" y="140" font-size="28" font-weight="700" letter-spacing="4" fill="#4f46e5">CHOISIR SANS PRÉFÉRENCE IMPOSÉE</text>
    <text x="120" y="210" font-size="54" font-weight="750" fill="#18181b">Le travail réel vient avant l’outil</text>
    <text x="120" y="258" font-size="25" fill="#52525b">Une inconnue reste visible. Une limite doit être reproduite.</text>
    <g filter="url(#shadow)">
      <rect x="120" y="345" width="350" height="220" rx="32" fill="#ffffff" stroke="#d4d4d8"/>
      <circle cx="180" cy="410" r="28" fill="#eef2ff"/>
      <path d="M168 410h24M180 398v24" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>
      <text x="225" y="420" font-size="32" font-weight="700" fill="#18181b">Observer</text>
      <text x="160" y="480" font-size="22" fill="#52525b">Tâches, exceptions, rôles,</text>
      <text x="160" y="514" font-size="22" fill="#52525b">charge et coût d’un arrêt</text>
      <rect x="625" y="345" width="350" height="220" rx="32" fill="#ffffff" stroke="#c7d2fe"/>
      <circle cx="685" cy="410" r="28" fill="#eef2ff"/>
      <path d="M672 410l9 9 18-22" fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="730" y="420" font-size="32" font-weight="700" fill="#18181b">Prouver</text>
      <text x="665" y="480" font-size="22" fill="#52525b">Droits, données, erreurs,</text>
      <text x="665" y="514" font-size="22" fill="#52525b">restauration et sortie</text>
      <rect x="1130" y="345" width="350" height="220" rx="32" fill="url(#accent)"/>
      <circle cx="1190" cy="410" r="28" fill="#ffffff" opacity="0.18"/>
      <path d="M1178 410h24M1197 410l-9-9M1197 410l-9 9" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1235" y="420" font-size="32" font-weight="700" fill="#ffffff">Décider</text>
      <text x="1170" y="480" font-size="22" fill="#ffffff">Conserver, renforcer,</text>
      <text x="1170" y="514" font-size="22" fill="#ffffff">hybrider ou sortir</text>
    </g>
    <path d="M486 455h115" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M580 438l22 17-22 17" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M991 455h115" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M1085 438l22 17-22 17" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="120" y="660" width="1360" height="112" rx="28" fill="#18181b"/>
    <text x="170" y="730" font-size="27" font-weight="700" fill="#ffffff">STOP</text>
    <text x="290" y="730" font-size="24" fill="#d4d4d8">si une preuve critique manque ou si la sortie n’a jamais été relue.</text>
  </g>
</svg>
