<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matrice de droits d’accès d’une application métier</title>
  <desc id="desc">Schéma fictif reliant une fonction de travail, un objet, une action, une portée, une décision et deux tests, sans score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090B"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="110" r="270" fill="#1D4ED8" opacity=".18"/>
  <circle cx="190" cy="835" r="300" fill="#0891B2" opacity=".12"/>
  <text x="90" y="82" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">SCHÉMA · DONNÉES FICTIVES · AUCUN SCORE</text>
  <text x="90" y="150" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700">Qui peut faire quoi, sur quel objet ?</text>
  <text x="90" y="200" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="25">Une règle lisible avant les profils et la configuration technique</text>

  <g filter="url(#shadow)">
    <rect x="90" y="270" width="1420" height="470" rx="30" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="120" y="300" width="1360" height="72" rx="18" fill="#111827"/>
    <text x="150" y="345" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">FONCTION</text>
    <text x="380" y="345" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">OBJET</text>
    <text x="600" y="345" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">ACTION</text>
    <text x="825" y="345" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PORTÉE</text>
    <text x="1080" y="345" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">DÉCISION</text>
    <text x="1300" y="345" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">TEST</text>

    <rect x="120" y="392" width="1360" height="104" rx="18" fill="#172033"/>
    <text x="150" y="439" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Responsable</text>
    <text x="150" y="470" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">fonction de travail</text>
    <text x="380" y="454" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="22">Demande</text>
    <text x="600" y="454" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="22">Valider</text>
    <text x="825" y="439" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="21">Son équipe</text>
    <text x="825" y="470" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">état : soumise</text>
    <rect x="1070" y="416" width="150" height="52" rx="26" fill="#064E3B" stroke="#34D399"/>
    <text x="1101" y="449" fill="#A7F3D0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">AUTORISÉ</text>
    <text x="1300" y="439" fill="#A7F3D0" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PASSER</text>
    <text x="1300" y="469" fill="#FCA5A5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">REFUSER</text>

    <rect x="120" y="516" width="1360" height="104" rx="18" fill="#172033"/>
    <text x="150" y="563" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Demandeur</text>
    <text x="150" y="594" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">fonction de travail</text>
    <text x="380" y="578" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="22">Demande</text>
    <text x="600" y="578" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="22">Supprimer</text>
    <text x="825" y="563" fill="#E2E8F0" font-family="Arial, Helvetica, sans-serif" font-size="21">À décider</text>
    <text x="825" y="594" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">responsable inconnu</text>
    <rect x="1070" y="540" width="150" height="52" rx="26" fill="#7F1D1D" stroke="#F87171"/>
    <text x="1115" y="573" fill="#FECACA" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">STOP</text>
    <text x="1300" y="563" fill="#FCA5A5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">AUCUN FEU</text>
    <text x="1300" y="593" fill="#FCA5A5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">VERT</text>

    <rect x="120" y="650" width="1360" height="60" rx="18" fill="url(#accent)" opacity=".16"/>
    <text x="150" y="688" fill="#CFFAFE" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Règle absente = refus · droit temporaire = fin datée · chaque autorisation = un test de refus</text>
  </g>

  <text x="90" y="820" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="20">Une matrice prépare la décision et la recette ; elle ne prouve ni sécurité ni conformité.</text>
</svg>
