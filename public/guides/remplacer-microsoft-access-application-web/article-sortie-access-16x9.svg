<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dossier de sortie Microsoft Access</title>
  <desc id="desc">Une base Access reliée à un inventaire de tâches, objets et dépendances, puis à sept trajectoires et à des preuves de reprise.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ec"/>
      <stop offset="1" stop-color="#ebe8ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#312e81" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1430" cy="110" r="235" fill="#c7d2fe" opacity=".35"/>
  <circle cx="120" cy="835" r="260" fill="#ddd6fe" opacity=".42"/>

  <text x="105" y="98" fill="#312e81" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">DOSSIER DE SORTIE ACCESS</text>
  <text x="105" y="158" fill="#18181b" font-family="Arial, sans-serif" font-size="47" font-weight="700">Ce qui doit survivre avant de choisir la cible</text>
  <text x="105" y="203" fill="#52525b" font-family="Arial, sans-serif" font-size="23">Tâches, objets, dépendances et preuves de reprise — les inconnues restent visibles.</text>

  <g filter="url(#shadow)">
    <rect x="105" y="286" width="330" height="360" rx="30" fill="#fff" stroke="#d4d4d8"/>
    <rect x="133" y="316" width="274" height="78" rx="18" fill="url(#accent)"/>
    <ellipse cx="181" cy="341" rx="25" ry="10" fill="#fff" opacity=".95"/>
    <rect x="156" y="341" width="50" height="27" fill="#fff" opacity=".95"/>
    <ellipse cx="181" cy="368" rx="25" ry="10" fill="#e0e7ff"/>
    <text x="226" y="355" fill="#fff" font-family="Arial, sans-serif" font-size="27" font-weight="700">Base Access</text>
    <text x="135" y="438" fill="#3f3f46" font-family="Arial, sans-serif" font-size="19" font-weight="700">Objets visibles</text>
    <text x="135" y="478" fill="#52525b" font-family="Arial, sans-serif" font-size="18">Tables · requêtes</text>
    <text x="135" y="513" fill="#52525b" font-family="Arial, sans-serif" font-size="18">Formulaires · rapports</text>
    <text x="135" y="548" fill="#52525b" font-family="Arial, sans-serif" font-size="18">Macros · VBA</text>
    <line x1="135" y1="577" x2="405" y2="577" stroke="#e4e4e7"/>
    <text x="135" y="613" fill="#7c3aed" font-family="Arial, sans-serif" font-size="17" font-weight="700">≠ spécification métier</text>
  </g>

  <path d="M465 466 H545" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
  <path d="M530 451 L548 466 L530 481" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="575" y="255" width="420" height="422" rx="30" fill="#fff" stroke="#d4d4d8"/>
    <text x="610" y="308" fill="#18181b" font-family="Arial, sans-serif" font-size="28" font-weight="700">Inventaire vérifiable</text>
    <g font-family="Arial, sans-serif" font-size="18">
      <rect x="610" y="340" width="350" height="48" rx="12" fill="#eef2ff"/>
      <circle cx="636" cy="364" r="8" fill="#4f46e5"/>
      <text x="657" y="371" fill="#3f3f46">Tâche et responsable</text>
      <rect x="610" y="400" width="350" height="48" rx="12" fill="#f4f4f5"/>
      <circle cx="636" cy="424" r="8" fill="#6366f1"/>
      <text x="657" y="431" fill="#3f3f46">Fréquence et criticité</text>
      <rect x="610" y="460" width="350" height="48" rx="12" fill="#eef2ff"/>
      <circle cx="636" cy="484" r="8" fill="#7c3aed"/>
      <text x="657" y="491" fill="#3f3f46">Dépendances et droits</text>
      <rect x="610" y="520" width="350" height="48" rx="12" fill="#f4f4f5"/>
      <circle cx="636" cy="544" r="8" fill="#8b5cf6"/>
      <text x="657" y="551" fill="#3f3f46">Cible encore hypothétique</text>
      <rect x="610" y="580" width="350" height="62" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
      <path d="M628 611 L638 621 L657 599" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="675" y="618" fill="#065f46" font-weight="700">Preuve de reprise</text>
    </g>
  </g>

  <path d="M1025 466 H1092" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
  <path d="M1077 451 L1095 466 L1077 481" fill="none" stroke="#6366f1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="1120" y="250" width="375" height="430" rx="30" fill="#111827"/>
    <text x="1155" y="303" fill="#c7d2fe" font-size="19" font-weight="700" letter-spacing="2">7 TRAJECTOIRES</text>
    <g font-size="17" font-weight="700">
      <rect x="1155" y="330" width="305" height="40" rx="10" fill="#312e81"/><text x="1175" y="356" fill="#fff">01 · Stabiliser Access</text>
      <rect x="1155" y="380" width="305" height="40" rx="10" fill="#3730a3"/><text x="1175" y="406" fill="#fff">02 · Séparer interface / données</text>
      <rect x="1155" y="430" width="305" height="40" rx="10" fill="#4338ca"/><text x="1175" y="456" fill="#fff">03 · Migrer le stockage</text>
      <rect x="1155" y="480" width="305" height="40" rx="10" fill="#4f46e5"/><text x="1175" y="506" fill="#fff">04 · Choisir un standard</text>
      <rect x="1155" y="530" width="305" height="40" rx="10" fill="#5b5bd6"/><text x="1175" y="556" fill="#fff">05 · Plateforme avec peu de code</text>
      <rect x="1155" y="580" width="305" height="40" rx="10" fill="#6d5ee8"/><text x="1175" y="606" fill="#fff">06 · Application web dédiée</text>
      <rect x="1155" y="630" width="305" height="40" rx="10" fill="#52525b"/><text x="1175" y="656" fill="#fff">07 · Ne pas migrer maintenant</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="105" y="738" width="1390" height="80" rx="22" fill="#fff" stroke="#d4d4d8"/>
    <circle cx="148" cy="778" r="19" fill="#ecfdf5" stroke="#6ee7b7"/>
    <path d="M139 778 L146 785 L158 770" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="182" y="786" fill="#27272a" font-size="22" font-weight="700">La cible est une hypothèse. La reprise se prouve avec les utilisateurs.</text>
  </g>
</svg>
