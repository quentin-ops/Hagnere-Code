<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Inventaire de sortie Access</title>
  <desc id="desc">Une base Access passe par un inventaire vérifiable avant sept trajectoires possibles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f5ec"/><stop offset="1" stop-color="#e8e7ff"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#312e81" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1100" cy="100" r="210" fill="#c7d2fe" opacity=".4"/>
  <text x="80" y="90" fill="#312e81" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">SORTIR D’ACCESS SANS PERDRE LE MÉTIER</text>
  <text x="80" y="150" fill="#18181b" font-family="Arial, sans-serif" font-size="46" font-weight="700">Inventorier avant de choisir</text>
  <text x="80" y="192" fill="#52525b" font-family="Arial, sans-serif" font-size="21">L’inconnue reste « à vérifier » ; la cible reste une hypothèse.</text>

  <g filter="url(#s)" font-family="Arial, sans-serif">
    <rect x="80" y="270" width="270" height="370" rx="28" fill="#fff" stroke="#d4d4d8"/>
    <rect x="110" y="305" width="210" height="82" rx="18" fill="url(#a)"/>
    <text x="136" y="354" fill="#fff" font-size="28" font-weight="700">Access</text>
    <text x="110" y="432" fill="#27272a" font-size="19" font-weight="700">Données + règles</text>
    <text x="110" y="473" fill="#52525b" font-size="17">Écrans · rapports</text>
    <text x="110" y="509" fill="#52525b" font-size="17">Macros · VBA</text>
    <text x="110" y="545" fill="#52525b" font-size="17">Connexions · fichiers</text>
    <line x1="110" y1="575" x2="320" y2="575" stroke="#e4e4e7"/>
    <text x="110" y="612" fill="#7c3aed" font-size="16" font-weight="700">Le fichier ne suffit pas</text>

    <rect x="400" y="250" width="375" height="410" rx="28" fill="#fff" stroke="#d4d4d8"/>
    <text x="435" y="302" fill="#18181b" font-size="27" font-weight="700">Dossier de sortie</text>
    <g font-size="17">
      <rect x="435" y="335" width="305" height="48" rx="12" fill="#eef2ff"/><text x="460" y="365" fill="#3f3f46">Tâche + responsable</text>
      <rect x="435" y="395" width="305" height="48" rx="12" fill="#f4f4f5"/><text x="460" y="425" fill="#3f3f46">Fréquence + criticité</text>
      <rect x="435" y="455" width="305" height="48" rx="12" fill="#eef2ff"/><text x="460" y="485" fill="#3f3f46">Dépendances + droits</text>
      <rect x="435" y="515" width="305" height="48" rx="12" fill="#f4f4f5"/><text x="460" y="545" fill="#3f3f46">Cible pressentie</text>
      <rect x="435" y="575" width="305" height="55" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/><text x="460" y="609" fill="#065f46" font-weight="700">✓ Preuve de reprise</text>
    </g>

    <rect x="825" y="270" width="295" height="370" rx="28" fill="#111827"/>
    <text x="855" y="319" fill="#c7d2fe" font-size="18" font-weight="700">7 TRAJECTOIRES</text>
    <g fill="#fff" font-size="15" font-weight="700">
      <text x="855" y="367">01 · Stabiliser</text><text x="855" y="407">02 · Séparer</text>
      <text x="855" y="447">03 · Stockage</text><text x="855" y="487">04 · Standard</text>
      <text x="855" y="527">05 · Peu de code</text><text x="855" y="567">06 · Web dédié</text>
      <text x="855" y="607">07 · Ne pas migrer</text>
    </g>
  </g>
  <path d="M360 455 H392" stroke="#6366f1" stroke-width="5"/><path d="M383 444 L395 455 L383 466" fill="none" stroke="#6366f1" stroke-width="5"/>
  <path d="M785 455 H817" stroke="#6366f1" stroke-width="5"/><path d="M808 444 L820 455 L808 466" fill="none" stroke="#6366f1" stroke-width="5"/>
  <rect x="80" y="725" width="1040" height="84" rx="22" fill="#fff" stroke="#d4d4d8"/>
  <text x="120" y="778" fill="#27272a" font-family="Arial, sans-serif" font-size="21" font-weight="700">La migration avance par preuves, pas par promesse de conversion automatique.</text>
</svg>
