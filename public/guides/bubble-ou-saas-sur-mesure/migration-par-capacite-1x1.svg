<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Migration d'une application Bubble par capacités</title>
  <desc id="desc">Un noyau représentant le service en activité est entouré de six capacités à reprendre : données, interfaces, workflows, intégrations, exploitation et gouvernance.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <rect width="900" height="900" rx="48" fill="url(#bg)"/>
  <text x="450" y="78" text-anchor="middle" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="3">MIGRER SANS CONFONDRE</text>
  <circle cx="450" cy="465" r="145" fill="#ffffff"/>
  <text x="450" y="448" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="800">Service</text>
  <text x="450" y="486" text-anchor="middle" fill="#111827" font-family="Arial, sans-serif" font-size="30" font-weight="800">en activité</text>
  <text x="450" y="526" text-anchor="middle" fill="#4f46e5" font-family="Arial, sans-serif" font-size="18" font-weight="700">CONTINUITÉ À PROUVER</text>
  <g fill="none" stroke="#818cf8" stroke-width="4" stroke-dasharray="8 10">
    <path d="M450 320V225"/><path d="M575 393l83-48"/><path d="M575 538l83 48"/>
    <path d="M450 610v95"/><path d="M325 538l-83 48"/><path d="M325 393l-83-48"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(450 177)"><rect x="-115" y="-48" width="230" height="96" rx="25" fill="#eef2ff"/><text y="9" fill="#3730a3" font-size="23" font-weight="800">Données</text></g>
    <g transform="translate(700 320)"><rect x="-115" y="-48" width="230" height="96" rx="25" fill="#dbeafe"/><text y="9" fill="#1d4ed8" font-size="23" font-weight="800">Interfaces</text></g>
    <g transform="translate(700 610)"><rect x="-115" y="-48" width="230" height="96" rx="25" fill="#ccfbf1"/><text y="9" fill="#0f766e" font-size="23" font-weight="800">Workflows</text></g>
    <g transform="translate(450 752)"><rect x="-115" y="-48" width="230" height="96" rx="25" fill="#fef3c7"/><text y="9" fill="#b45309" font-size="23" font-weight="800">Intégrations</text></g>
    <g transform="translate(200 610)"><rect x="-115" y="-48" width="230" height="96" rx="25" fill="#fee2e2"/><text y="9" fill="#b91c1c" font-size="23" font-weight="800">Exploitation</text></g>
    <g transform="translate(200 320)"><rect x="-115" y="-48" width="230" height="96" rx="25" fill="#f3e8ff"/><text y="9" fill="#7e22ce" font-size="23" font-weight="800">Gouvernance</text></g>
  </g>
</svg>
