<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cinq décisions après la comparaison entre Bubble et une base de code dédiée</title>
  <desc id="desc">Un chemin de décision mène vers rester ou démarrer sur Bubble, construire en code dédié, isoler un composant dans une approche hybride, simplifier le besoin ou reporter la décision. Les détails figurent dans le tableau HTML adjacent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="56" fill="url(#bg)"/>
  <circle cx="1390" cy="95" r="245" fill="#6366f1" opacity=".18"/>
  <circle cx="120" cy="825" r="270" fill="#14b8a6" opacity=".11"/>
  <text x="800" y="90" text-anchor="middle" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="4">UNE COMPARAISON</text>
  <text x="800" y="160" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="800">Cinq sorties possibles</text>

  <g transform="translate(100 225)" filter="url(#shadow)">
    <rect width="680" height="155" rx="28" fill="#eef2ff"/>
    <circle cx="82" cy="78" r="42" fill="#c7d2fe"/>
    <text x="82" y="92" text-anchor="middle" fill="#4338ca" font-family="Arial, sans-serif" font-size="42" font-weight="800">B</text>
    <text x="145" y="95" fill="#312e81" font-family="Arial, sans-serif" font-size="52" font-weight="800">BUBBLE</text>
  </g>
  <g transform="translate(820 225)" filter="url(#shadow)">
    <rect width="680" height="155" rx="28" fill="#dbeafe"/>
    <circle cx="82" cy="78" r="42" fill="#bfdbfe"/>
    <text x="82" y="90" text-anchor="middle" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="34" font-weight="800">&lt;/&gt;</text>
    <text x="145" y="95" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="52" font-weight="800">CODE DÉDIÉ</text>
  </g>
  <g transform="translate(100 420)" filter="url(#shadow)">
    <rect width="680" height="155" rx="28" fill="#ccfbf1"/>
    <circle cx="82" cy="78" r="42" fill="#99f6e4"/>
    <text x="82" y="92" text-anchor="middle" fill="#0f766e" font-family="Arial, sans-serif" font-size="42" font-weight="800">H</text>
    <text x="145" y="95" fill="#115e59" font-family="Arial, sans-serif" font-size="52" font-weight="800">HYBRIDE</text>
  </g>
  <g transform="translate(820 420)" filter="url(#shadow)">
    <rect width="680" height="155" rx="28" fill="#fef3c7"/>
    <circle cx="82" cy="78" r="42" fill="#fde68a"/>
    <text x="82" y="92" text-anchor="middle" fill="#b45309" font-family="Arial, sans-serif" font-size="44" font-weight="800">−</text>
    <text x="145" y="95" fill="#92400e" font-family="Arial, sans-serif" font-size="52" font-weight="800">SIMPLIFIER</text>
  </g>
  <g transform="translate(460 615)" filter="url(#shadow)">
    <rect width="680" height="155" rx="28" fill="#fee2e2"/>
    <circle cx="82" cy="78" r="42" fill="#fecaca"/>
    <rect x="68" y="58" width="10" height="40" rx="4" fill="#b91c1c"/>
    <rect x="86" y="58" width="10" height="40" rx="4" fill="#b91c1c"/>
    <text x="145" y="95" fill="#991b1b" font-family="Arial, sans-serif" font-size="52" font-weight="800">REPORTER</text>
  </g>

  <text x="800" y="835" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Même besoin · mêmes exigences · mêmes preuves</text>
</svg>
