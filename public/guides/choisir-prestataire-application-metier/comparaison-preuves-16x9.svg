<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Comparer un prestataire par un cas commun et huit preuves</title>
  <desc id="desc">Un cas métier fictif traverse huit points de preuve avant une décision, avec une branche STOP pour les conditions inacceptables.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="1360" cy="90" r="250" fill="#22d3ee" opacity="0.08"/>
  <circle cx="260" cy="810" r="300" fill="#818cf8" opacity="0.08"/>

  <text x="88" y="90" fill="#67e8f9" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">COMPARAISON PAR PREUVES</text>
  <text x="88" y="148" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="700">Même cas. Même période. Inconnues visibles.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="224" width="360" height="450" rx="28" fill="url(#card)" stroke="#a5f3fc" stroke-opacity="0.45"/>
    <rect x="120" y="258" width="120" height="34" rx="17" fill="#083344"/>
    <text x="180" y="282" text-anchor="middle" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="16" font-weight="700">CAS FICTIF</text>
    <text x="120" y="350" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Commande</text>
    <text x="120" y="390" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">stock + crédit</text>
    <text x="120" y="452" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="21">Que demande le candidat ?</text>
    <text x="120" y="492" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="21">Que suppose-t-il encore ?</text>
    <text x="120" y="532" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="21">Comment prouve-t-il le résultat ?</text>
    <path d="M120 590h270" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="2"/>
    <text x="120" y="630" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="18" font-weight="700">Aucune donnée réelle</text>
  </g>

  <path d="M472 450h80" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
  <path d="M540 438l18 12-18 12" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="576" y="224" width="560" height="450" rx="28" fill="#ffffff" fill-opacity="0.96"/>
    <text x="616" y="278" fill="#111827" font-family="Arial, sans-serif" font-size="26" font-weight="700">8 preuves non compensables</text>
    <g font-family="Arial, sans-serif" font-size="19" font-weight="700">
      <rect x="616" y="316" width="224" height="58" rx="16" fill="#ecfeff"/><text x="638" y="352" fill="#155e75">01 Compréhension</text>
      <rect x="872" y="316" width="224" height="58" rx="16" fill="#eef2ff"/><text x="894" y="352" fill="#3730a3">02 Périmètre</text>
      <rect x="616" y="396" width="224" height="58" rx="16" fill="#eef2ff"/><text x="638" y="432" fill="#3730a3">03 Validation</text>
      <rect x="872" y="396" width="224" height="58" rx="16" fill="#ecfeff"/><text x="894" y="432" fill="#155e75">04 Coûts</text>
      <rect x="616" y="476" width="224" height="58" rx="16" fill="#ecfeff"/><text x="638" y="512" fill="#155e75">05 Données</text>
      <rect x="872" y="476" width="224" height="58" rx="16" fill="#eef2ff"/><text x="894" y="512" fill="#3730a3">06 Droits</text>
      <rect x="616" y="556" width="224" height="58" rx="16" fill="#eef2ff"/><text x="638" y="592" fill="#3730a3">07 Maintenance</text>
      <rect x="872" y="556" width="224" height="58" rx="16" fill="#ecfeff"/><text x="894" y="592" fill="#155e75">08 Sortie</text>
    </g>
  </g>

  <path d="M1160 450h74" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
  <path d="M1222 438l18 12-18 12" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="1260" y="224" width="252" height="280" rx="28" fill="#ecfdf5"/>
    <text x="1294" y="276" fill="#047857" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">DOSSIER</text>
    <text x="1294" y="326" fill="#064e3b" font-family="Arial, sans-serif" font-size="28" font-weight="700">Candidat</text>
    <text x="1294" y="364" fill="#064e3b" font-family="Arial, sans-serif" font-size="28" font-weight="700">à la décision</text>
    <text x="1294" y="418" fill="#065f46" font-family="Arial, sans-serif" font-size="18">Pas un gagnant</text>
    <text x="1294" y="448" fill="#065f46" font-family="Arial, sans-serif" font-size="18">automatique</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1260" y="536" width="252" height="138" rx="24" fill="#fff1f2" stroke="#fda4af"/>
    <text x="1294" y="584" fill="#be123c" font-family="Arial, sans-serif" font-size="24" font-weight="800">STOP</text>
    <text x="1294" y="622" fill="#9f1239" font-family="Arial, sans-serif" font-size="17">Une condition critique</text>
    <text x="1294" y="650" fill="#9f1239" font-family="Arial, sans-serif" font-size="17">ne se compense pas.</text>
  </g>

  <text x="88" y="806" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="21">Écrit vérifiable &gt; réponse orale · Inconnu ≠ zéro · Agence, freelance ou équipe interne : aucune hiérarchie générale</text>
</svg>
