<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Choisir un prestataire par des preuves comparables</title>
  <desc id="desc">Même cas fictif, huit preuves non compensables, coûts connus et décision sans score magique.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.58" stop-color="#172554"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" rx="44" fill="url(#bg)"/>
  <circle cx="900" cy="95" r="200" fill="#22d3ee" opacity="0.08"/>
  <circle cx="100" cy="930" r="220" fill="#818cf8" opacity="0.08"/>
  <text x="64" y="72" fill="#67e8f9" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CHOISIR UN PRESTATAIRE</text>
  <text x="64" y="122" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="700">Comparer les preuves,</text>
  <text x="64" y="166" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="700">pas les promesses.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="214" width="872" height="116" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#a5f3fc" stroke-opacity="0.45"/>
    <text x="96" y="255" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="16" font-weight="700">CAS ENTIÈREMENT FICTIF</text>
    <text x="96" y="298" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="700">Commande · stock · crédit · exception · trace</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="370" width="872" height="410" rx="28" fill="#ffffff" fill-opacity="0.97"/>
    <text x="96" y="420" fill="#111827" font-family="Arial, sans-serif" font-size="24" font-weight="700">8 preuves non compensables</text>
    <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
      <rect x="96" y="454" width="376" height="58" rx="16" fill="#ecfeff"/><text x="120" y="490" fill="#155e75">01 Compréhension observée</text>
      <rect x="492" y="454" width="412" height="58" rx="16" fill="#eef2ff"/><text x="516" y="490" fill="#3730a3">02 Périmètre et exclusions</text>
      <rect x="96" y="532" width="376" height="58" rx="16" fill="#eef2ff"/><text x="120" y="568" fill="#3730a3">03 Validation écrite</text>
      <rect x="492" y="532" width="412" height="58" rx="16" fill="#ecfeff"/><text x="516" y="568" fill="#155e75">04 Coûts sur la même période</text>
      <rect x="96" y="610" width="376" height="58" rx="16" fill="#ecfeff"/><text x="120" y="646" fill="#155e75">05 Données et sécurité</text>
      <rect x="492" y="610" width="412" height="58" rx="16" fill="#eef2ff"/><text x="516" y="646" fill="#3730a3">06 Droits et comptes</text>
      <rect x="96" y="688" width="376" height="58" rx="16" fill="#eef2ff"/><text x="120" y="724" fill="#3730a3">07 Maintenance</text>
      <rect x="492" y="688" width="412" height="58" rx="16" fill="#ecfeff"/><text x="516" y="724" fill="#155e75">08 Sortie et reprise</text>
    </g>
  </g>

  <rect x="64" y="820" width="548" height="74" rx="20" fill="#ecfdf5"/>
  <text x="92" y="852" fill="#047857" font-family="Arial, sans-serif" font-size="18" font-weight="700">DOSSIER CANDIDAT À LA DÉCISION</text>
  <text x="92" y="878" fill="#065f46" font-family="Arial, sans-serif" font-size="16">Aucun gagnant automatique</text>
  <rect x="634" y="820" width="302" height="74" rx="20" fill="#fff1f2"/>
  <text x="662" y="852" fill="#be123c" font-family="Arial, sans-serif" font-size="20" font-weight="800">STOP</text>
  <text x="662" y="878" fill="#9f1239" font-family="Arial, sans-serif" font-size="16">Non compensable</text>

  <text x="64" y="950" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="18">Inconnu ≠ zéro · Aucune donnée réelle</text>
</svg>
