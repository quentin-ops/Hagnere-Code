<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Grille de comparaison d’un prestataire d’application métier</title>
  <desc id="desc">Un cas fictif commun conduit vers huit preuves, un dossier candidat ou un arrêt explicite.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="44" fill="url(#bg)"/>
  <circle cx="1080" cy="100" r="220" fill="#22d3ee" opacity="0.08"/>
  <circle cx="130" cy="850" r="240" fill="#818cf8" opacity="0.08"/>
  <text x="72" y="74" fill="#67e8f9" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">COMPARAISON PAR PREUVES</text>
  <text x="72" y="124" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="700">Même cas métier. Inconnues visibles.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="176" width="1056" height="138" rx="26" fill="#ffffff" fill-opacity="0.1" stroke="#a5f3fc" stroke-opacity="0.45"/>
    <rect x="104" y="207" width="118" height="32" rx="16" fill="#083344"/>
    <text x="163" y="229" text-anchor="middle" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="15" font-weight="700">CAS FICTIF</text>
    <text x="104" y="276" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Commande : stock + crédit → questions, hypothèses, preuve du résultat</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="350" width="1056" height="354" rx="28" fill="#ffffff" fill-opacity="0.97"/>
    <text x="108" y="400" fill="#111827" font-family="Arial, sans-serif" font-size="25" font-weight="700">8 preuves non compensables</text>
    <g font-family="Arial, sans-serif" font-size="18" font-weight="700">
      <rect x="108" y="434" width="220" height="58" rx="16" fill="#ecfeff"/><text x="130" y="470" fill="#155e75">01 Compréhension</text>
      <rect x="346" y="434" width="220" height="58" rx="16" fill="#eef2ff"/><text x="368" y="470" fill="#3730a3">02 Périmètre</text>
      <rect x="584" y="434" width="220" height="58" rx="16" fill="#eef2ff"/><text x="606" y="470" fill="#3730a3">03 Validation</text>
      <rect x="822" y="434" width="270" height="58" rx="16" fill="#ecfeff"/><text x="844" y="470" fill="#155e75">04 Coûts comparables</text>
      <rect x="108" y="514" width="220" height="58" rx="16" fill="#ecfeff"/><text x="130" y="550" fill="#155e75">05 Données</text>
      <rect x="346" y="514" width="220" height="58" rx="16" fill="#eef2ff"/><text x="368" y="550" fill="#3730a3">06 Droits</text>
      <rect x="584" y="514" width="220" height="58" rx="16" fill="#eef2ff"/><text x="606" y="550" fill="#3730a3">07 Maintenance</text>
      <rect x="822" y="514" width="270" height="58" rx="16" fill="#ecfeff"/><text x="844" y="550" fill="#155e75">08 Sortie et reprise</text>
    </g>
    <rect x="108" y="608" width="640" height="74" rx="18" fill="#ecfdf5"/>
    <text x="136" y="638" fill="#047857" font-family="Arial, sans-serif" font-size="19" font-weight="700">Dossier candidat à la décision</text>
    <text x="136" y="666" fill="#065f46" font-family="Arial, sans-serif" font-size="17">Pas un gagnant automatique</text>
    <rect x="772" y="608" width="320" height="74" rx="18" fill="#fff1f2"/>
    <text x="800" y="653" fill="#be123c" font-family="Arial, sans-serif" font-size="21" font-weight="700">STOP non compensable</text>
  </g>

  <text x="72" y="782" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Écrit vérifiable &gt; réponse orale</text>
  <text x="72" y="824" fill="#d4d4d8" font-family="Arial, sans-serif" font-size="20">Aucune donnée réelle · Inconnu ≠ zéro · Aucune hiérarchie agence / freelance</text>
</svg>
