<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Les dix couches à examiner dans une architecture SaaS multitenant</title>
  <desc id="desc">Deux colonnes relient le parcours d'une requête aux données et aux opérations. Chaque couche peut être partagée, groupée ou dédiée indépendamment des autres.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef2ff" />
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)" />
  <text x="64" y="72" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="750">Une décision par couche, pas seulement par base</text>
  <text x="64" y="108" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Le niveau d’isolation peut évoluer d’une ligne à l’autre.</text>

  <path d="M348 187 H852" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" />
  <path d="M836 174 L854 187 L836 200" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="600" y="166" text-anchor="middle" fill="#4338ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">CONTEXTE TENANT CONSERVÉ ET VÉRIFIÉ</text>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(64 222)">
      <rect width="500" height="64" rx="16" fill="#ffffff" stroke="#bfdbfe" />
      <circle cx="34" cy="32" r="19" fill="#dbeafe" /><text x="34" y="38" text-anchor="middle" fill="#1d4ed8" font-size="17" font-weight="800">1</text>
      <text x="68" y="27" fill="#0f172a" font-size="18" font-weight="750">Tenant métier</text>
      <text x="68" y="49" fill="#475569" font-size="14">groupe, filiale, espace, contrat, cycle de vie</text>
    </g>
    <g transform="translate(64 302)">
      <rect width="500" height="64" rx="16" fill="#ffffff" stroke="#bfdbfe" />
      <circle cx="34" cy="32" r="19" fill="#dbeafe" /><text x="34" y="38" text-anchor="middle" fill="#1d4ed8" font-size="17" font-weight="800">2</text>
      <text x="68" y="27" fill="#0f172a" font-size="18" font-weight="750">Identité et contexte actif</text>
      <text x="68" y="49" fill="#475569" font-size="14">session, appartenances, organisation choisie</text>
    </g>
    <g transform="translate(64 382)">
      <rect width="500" height="64" rx="16" fill="#ffffff" stroke="#bfdbfe" />
      <circle cx="34" cy="32" r="19" fill="#dbeafe" /><text x="34" y="38" text-anchor="middle" fill="#1d4ed8" font-size="17" font-weight="800">3</text>
      <text x="68" y="27" fill="#0f172a" font-size="18" font-weight="750">Autorisation objet</text>
      <text x="68" y="49" fill="#475569" font-size="14">lecture, écriture, export, administration</text>
    </g>
    <g transform="translate(64 462)">
      <rect width="500" height="64" rx="16" fill="#ffffff" stroke="#bfdbfe" />
      <circle cx="34" cy="32" r="19" fill="#dbeafe" /><text x="34" y="38" text-anchor="middle" fill="#1d4ed8" font-size="17" font-weight="800">4</text>
      <text x="68" y="27" fill="#0f172a" font-size="18" font-weight="750">Application et tâches de fond</text>
      <text x="68" y="49" fill="#475569" font-size="14">API, workers, tâches planifiées, reprises</text>
    </g>
    <g transform="translate(64 542)">
      <rect width="500" height="64" rx="16" fill="#ffffff" stroke="#bfdbfe" />
      <circle cx="34" cy="32" r="19" fill="#dbeafe" /><text x="34" y="38" text-anchor="middle" fill="#1d4ed8" font-size="17" font-weight="800">5</text>
      <text x="68" y="27" fill="#0f172a" font-size="18" font-weight="750">Données et fichiers</text>
      <text x="68" y="49" fill="#475569" font-size="14">lignes, schémas, bases, objets, index</text>
    </g>

    <g transform="translate(636 222)">
      <rect width="500" height="64" rx="16" fill="#ffffff" stroke="#ddd6fe" />
      <circle cx="34" cy="32" r="19" fill="#ede9fe" /><text x="34" y="38" text-anchor="middle" fill="#6d28d9" font-size="17" font-weight="800">6</text>
      <text x="68" y="27" fill="#0f172a" font-size="18" font-weight="750">Cache et recherche</text>
      <text x="68" y="49" fill="#475569" font-size="14">clé tenant, index, TTL, invalidation</text>
    </g>
    <g transform="translate(636 302)">
      <rect width="500" height="64" rx="16" fill="#ffffff" stroke="#ddd6fe" />
      <circle cx="34" cy="32" r="19" fill="#ede9fe" /><text x="34" y="38" text-anchor="middle" fill="#6d28d9" font-size="17" font-weight="800">7</text>
      <text x="68" y="27" fill="#0f172a" font-size="18" font-weight="750">Événements et files</text>
      <text x="68" y="49" fill="#475569" font-size="14">tenant, action, objet, ordre, nouvel essai</text>
    </g>
    <g transform="translate(636 382)">
      <rect width="500" height="64" rx="16" fill="#ffffff" stroke="#ddd6fe" />
      <circle cx="34" cy="32" r="19" fill="#ede9fe" /><text x="34" y="38" text-anchor="middle" fill="#6d28d9" font-size="17" font-weight="800">8</text>
      <text x="68" y="27" fill="#0f172a" font-size="18" font-weight="750">Logs, support et administration</text>
      <text x="68" y="49" fill="#475569" font-size="14">filtre, attribution, rôle, rayon d’impact</text>
    </g>
    <g transform="translate(636 462)">
      <rect width="500" height="64" rx="16" fill="#ffffff" stroke="#ddd6fe" />
      <circle cx="34" cy="32" r="19" fill="#ede9fe" /><text x="34" y="38" text-anchor="middle" fill="#6d28d9" font-size="17" font-weight="800">9</text>
      <text x="68" y="27" fill="#0f172a" font-size="18" font-weight="750">Sauvegarde, restauration et sortie</text>
      <text x="68" y="49" fill="#475569" font-size="14">périmètre, instant, preuve, déplacement</text>
    </g>
    <g transform="translate(636 542)">
      <rect width="500" height="64" rx="16" fill="#ffffff" stroke="#ddd6fe" />
      <circle cx="34" cy="32" r="19" fill="#ede9fe" /><text x="34" y="38" text-anchor="middle" fill="#6d28d9" font-size="17" font-weight="800">10</text>
      <text x="68" y="27" fill="#0f172a" font-size="18" font-weight="750">Calcul, réseau, région et déploiement</text>
      <text x="68" y="49" fill="#475569" font-size="14">partage, groupe, dédié, rayon d’impact</text>
    </g>
  </g>

  <rect x="64" y="625" width="1072" height="28" rx="14" fill="#e0e7ff" />
  <text x="600" y="645" text-anchor="middle" fill="#3730a3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Pour chaque couche : CONTRAINTE → PREUVE → OPTION → TRAVAIL D’EXPLOITATION</text>
</svg>
