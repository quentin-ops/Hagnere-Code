<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Protocole fictif d'isolation entre deux organisations</title>
  <desc id="desc">Atelier Aube et Bureau Boréal exécutent neuf scénarios croisés. Chaque scénario doit conserver un attendu, une observation et une trace sans compensation entre résultats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc" /><stop offset="1" stop-color="#eef2ff" /></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.12" /></filter>
  </defs>
  <rect width="720" height="720" rx="28" fill="url(#bg)" />
  <text x="360" y="55" text-anchor="middle" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="750">Test A/B fictif — neuf scénarios</text>
  <text x="360" y="83" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Attendu écrit avant l’essai · données synthétiques</text>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(46 112)">
      <rect width="252" height="112" rx="22" fill="#fff" stroke="#93c5fd" stroke-width="2" />
      <circle cx="47" cy="47" r="27" fill="#dbeafe" /><text x="47" y="56" text-anchor="middle" fill="#1d4ed8" font-size="25" font-weight="850">A</text>
      <text x="88" y="42" fill="#0f172a" font-size="19" font-weight="750">Atelier Aube</text>
      <text x="88" y="66" fill="#475569" font-size="14">A-ALPHA</text>
      <text x="24" y="94" fill="#1d4ed8" font-size="13" font-weight="700">origine de l’action adverse</text>
    </g>
    <g transform="translate(422 112)">
      <rect width="252" height="112" rx="22" fill="#fff" stroke="#c4b5fd" stroke-width="2" />
      <circle cx="47" cy="47" r="27" fill="#ede9fe" /><text x="47" y="56" text-anchor="middle" fill="#6d28d9" font-size="25" font-weight="850">B</text>
      <text x="88" y="42" fill="#0f172a" font-size="19" font-weight="750">Bureau Boréal</text>
      <text x="88" y="66" fill="#475569" font-size="14">B-BRAVO</text>
      <text x="24" y="94" fill="#6d28d9" font-size="13" font-weight="700">objet qui doit rester isolé</text>
    </g>
  </g>

  <path d="M302 168 H414" stroke="#6366f1" stroke-width="4" stroke-dasharray="8 7" />
  <path d="M401 157 L415 168 L401 179" fill="none" stroke="#6366f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="360" y="151" text-anchor="middle" fill="#4338ca" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">ACCÈS CROISÉ</text>

  <g transform="translate(46 263)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="628" height="310" rx="24" fill="#fff" stroke="#cbd5e1" />
    <text x="24" y="39" fill="#0f172a" font-size="18" font-weight="750">Chaque ligne est non compensable</text>
    <g font-size="14" font-weight="700">
      <g transform="translate(24 62)"><rect width="182" height="52" rx="13" fill="#eff6ff" /><text x="16" y="23" fill="#1e3a8a">01 · Lecture</text><text x="16" y="42" fill="#475569" font-size="12" font-weight="500">objet B absent chez A</text></g>
      <g transform="translate(223 62)"><rect width="182" height="52" rx="13" fill="#eef2ff" /><text x="16" y="23" fill="#3730a3">02 · Écriture</text><text x="16" y="42" fill="#475569" font-size="12" font-weight="500">état B inchangé</text></g>
      <g transform="translate(422 62)"><rect width="182" height="52" rx="13" fill="#f5f3ff" /><text x="16" y="23" fill="#5b21b6">03 · Export</text><text x="16" y="42" fill="#475569" font-size="12" font-weight="500">aucun marqueur B</text></g>
      <g transform="translate(24 129)"><rect width="182" height="52" rx="13" fill="#eff6ff" /><text x="16" y="23" fill="#1e3a8a">04 · Tâche</text><text x="16" y="42" fill="#475569" font-size="12" font-weight="500">contexte A conservé</text></g>
      <g transform="translate(223 129)"><rect width="182" height="52" rx="13" fill="#eef2ff" /><text x="16" y="23" fill="#3730a3">05 · Fichier</text><text x="16" y="42" fill="#475569" font-size="12" font-weight="500">clé B refusée</text></g>
      <g transform="translate(422 129)"><rect width="182" height="52" rx="13" fill="#f5f3ff" /><text x="16" y="23" fill="#5b21b6">06 · Cache</text><text x="16" y="42" fill="#475569" font-size="12" font-weight="500">aucune réponse A chez B</text></g>
      <g transform="translate(24 196)"><rect width="182" height="52" rx="13" fill="#eff6ff" /><text x="16" y="23" fill="#1e3a8a">07 · Logs/support</text><text x="16" y="42" fill="#475569" font-size="12" font-weight="500">vue et rôle limités</text></g>
      <g transform="translate(223 196)"><rect width="182" height="52" rx="13" fill="#eef2ff" /><text x="16" y="23" fill="#3730a3">08 · Sauvegarde</text><text x="16" y="42" fill="#475569" font-size="12" font-weight="500">aucune ligne omise</text></g>
      <g transform="translate(422 196)"><rect width="182" height="52" rx="13" fill="#f5f3ff" /><text x="16" y="23" fill="#5b21b6">09 · Restauration</text><text x="16" y="42" fill="#475569" font-size="12" font-weight="500">A cohérent, B inchangé</text></g>
    </g>
    <rect x="24" y="263" width="580" height="27" rx="13" fill="#e0e7ff" />
    <text x="314" y="282" text-anchor="middle" fill="#3730a3" font-size="13" font-weight="800">ATTENDU · OBSERVATION · TRACE · VERSION</text>
  </g>

  <g transform="translate(46 600)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect width="628" height="76" rx="18" fill="#fff7ed" stroke="#fed7aa" />
    <text x="22" y="29" fill="#9a3412" font-size="15" font-weight="800">Limite</text>
    <text x="22" y="53" fill="#7c2d12" font-size="14">Ce protocole révèle des erreurs observées ; il ne certifie ni sécurité ni conformité.</text>
  </g>
</svg>
