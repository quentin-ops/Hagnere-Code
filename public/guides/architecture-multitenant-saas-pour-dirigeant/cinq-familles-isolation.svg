<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
  <title id="title">Cinq familles d'isolation pour un SaaS multitenant</title>
  <desc id="desc">Cinq cartes comparent le partage contrôlé, le schéma ou namespace, la ressource de données dédiée, le déploiement dédié et le modèle hybride ou ciblé sans les classer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc" /><stop offset="1" stop-color="#f5f3ff" /></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#312e81" flood-opacity="0.10" /></filter>
  </defs>
  <rect width="900" height="675" rx="28" fill="url(#bg)" />
  <text x="54" y="66" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="750">Cinq familles, aucune gagnante universelle</text>
  <text x="54" y="99" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Une architecture peut aussi combiner plusieurs cartes.</text>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(54 132)">
      <rect width="380" height="142" rx="20" fill="#fff" stroke="#bfdbfe" />
      <rect x="18" y="18" width="58" height="28" rx="14" fill="#dbeafe" /><text x="47" y="38" text-anchor="middle" fill="#1d4ed8" font-size="14" font-weight="800">01</text>
      <text x="92" y="40" fill="#0f172a" font-size="19" font-weight="750">Partage contrôlé</text>
      <text x="20" y="76" fill="#334155" font-size="15">Ressources communes, contexte tenant</text>
      <text x="20" y="99" fill="#334155" font-size="15">validé à chaque chemin et quotas suivis.</text>
      <text x="20" y="126" fill="#1d4ed8" font-size="13" font-weight="700">Preuve : accès croisé + charge A/B</text>
    </g>
    <g transform="translate(466 132)">
      <rect width="380" height="142" rx="20" fill="#fff" stroke="#c4b5fd" />
      <rect x="18" y="18" width="58" height="28" rx="14" fill="#ede9fe" /><text x="47" y="38" text-anchor="middle" fill="#6d28d9" font-size="14" font-weight="800">02</text>
      <text x="92" y="40" fill="#0f172a" font-size="19" font-weight="750">Schéma ou namespace</text>
      <text x="20" y="76" fill="#334155" font-size="15">Séparation logique et inventaire facilités ;</text>
      <text x="20" y="99" fill="#334155" font-size="15">garantie dépendante du moteur et des rôles.</text>
      <text x="20" y="126" fill="#6d28d9" font-size="13" font-weight="700">Preuve : rôle, connexion, migration</text>
    </g>
    <g transform="translate(54 298)">
      <rect width="380" height="142" rx="20" fill="#fff" stroke="#99f6e4" />
      <rect x="18" y="18" width="58" height="28" rx="14" fill="#ccfbf1" /><text x="47" y="38" text-anchor="middle" fill="#0f766e" font-size="14" font-weight="800">03</text>
      <text x="92" y="40" fill="#0f172a" font-size="19" font-weight="750">Données dédiées</text>
      <text x="20" y="76" fill="#334155" font-size="15">Base, compte de stockage ou autre ressource</text>
      <text x="20" y="99" fill="#334155" font-size="15">propre ; les autres couches restent à vérifier.</text>
      <text x="20" y="126" fill="#0f766e" font-size="13" font-weight="700">Preuve : sauvegarde + restauration</text>
    </g>
    <g transform="translate(466 298)">
      <rect width="380" height="142" rx="20" fill="#fff" stroke="#fde68a" />
      <rect x="18" y="18" width="58" height="28" rx="14" fill="#fef3c7" /><text x="47" y="38" text-anchor="middle" fill="#b45309" font-size="14" font-weight="800">04</text>
      <text x="92" y="40" fill="#0f172a" font-size="19" font-weight="750">Déploiement dédié</text>
      <text x="20" y="76" fill="#334155" font-size="15">Instance ou stamp propre sur plusieurs couches ;</text>
      <text x="20" y="99" fill="#334155" font-size="15">certaines opérations peuvent rester communes.</text>
      <text x="20" y="126" fill="#b45309" font-size="13" font-weight="700">Preuve : cycle de vie complet</text>
    </g>
    <g transform="translate(260 464)">
      <rect width="380" height="142" rx="20" fill="#fff" stroke="#fbcfe8" />
      <rect x="18" y="18" width="58" height="28" rx="14" fill="#fce7f3" /><text x="47" y="38" text-anchor="middle" fill="#be185d" font-size="14" font-weight="800">05</text>
      <text x="92" y="40" fill="#0f172a" font-size="19" font-weight="750">Hybride ou ciblée</text>
      <text x="20" y="76" fill="#334155" font-size="15">Une couche lourde ou sensible est dédiée ;</text>
      <text x="20" y="99" fill="#334155" font-size="15">le reste demeure partagé et observable.</text>
      <text x="20" y="126" fill="#be185d" font-size="13" font-weight="700">Preuve : contrainte ciblée mesurée</text>
    </g>
  </g>
  <text x="450" y="643" text-anchor="middle" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Choisir après la contrainte et le test — jamais à partir du nom de la famille.</text>
</svg>
