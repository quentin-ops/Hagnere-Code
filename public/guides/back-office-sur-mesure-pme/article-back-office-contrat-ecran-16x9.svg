<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Contrat d’écran d’un back-office de PME</title>
  <desc id="desc">Une file mène à une fiche, une action, une exception puis une reprise. Le rôle, les données, la preuve et le support entourent ce parcours. La maquette utilise des données fictives.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#312e81" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="90" r="220" fill="#c4b5fd" opacity="0.22"/>
  <circle cx="110" cy="850" r="250" fill="#a5b4fc" opacity="0.18"/>

  <text x="110" y="105" fill="#312e81" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3">CONTRAT D’ÉCRAN</text>
  <text x="110" y="165" fill="#18181b" font-family="Georgia, serif" font-size="48" font-weight="700">Du traitement courant à la reprise</text>
  <text x="110" y="205" fill="#52525b" font-family="Arial, Helvetica, sans-serif" font-size="22">Rôle → action → données → preuve → exception → reprise</text>
  <rect x="1224" y="92" width="266" height="48" rx="24" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="1357" y="123" text-anchor="middle" fill="#4338ca" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Maquette — données fictives</text>

  <g filter="url(#shadow)">
    <rect x="105" y="300" width="238" height="210" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="367" y="300" width="238" height="210" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="629" y="300" width="238" height="210" rx="28" fill="url(#main)"/>
    <rect x="891" y="300" width="238" height="210" rx="28" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <rect x="1153" y="300" width="238" height="210" rx="28" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#6366f1" stroke-width="5" marker-end="url(#arrow)">
    <path d="M343 405H357"/>
    <path d="M605 405H619"/>
    <path d="M867 405H881"/>
    <path d="M1129 405H1143"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="154" cy="350" r="22" fill="#eef2ff"/>
    <path d="M144 343h20M144 350h20M144 357h13" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
    <text x="145" y="407" fill="#18181b" font-size="26" font-weight="700">File</text>
    <text x="145" y="444" fill="#52525b" font-size="17">Ce qui attend</text>
    <text x="145" y="470" fill="#52525b" font-size="17">une décision</text>

    <circle cx="416" cy="350" r="22" fill="#eef2ff"/>
    <rect x="406" y="340" width="20" height="20" rx="3" fill="none" stroke="#4f46e5" stroke-width="3"/>
    <path d="M411 347h10M411 353h7" stroke="#4f46e5" stroke-width="2"/>
    <text x="407" y="407" fill="#18181b" font-size="26" font-weight="700">Fiche</text>
    <text x="407" y="444" fill="#52525b" font-size="17">La source et</text>
    <text x="407" y="470" fill="#52525b" font-size="17">l’état réel</text>

    <circle cx="678" cy="350" r="22" fill="#ffffff" opacity="0.2"/>
    <path d="M669 350l7 7 13-15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="669" y="407" fill="#ffffff" font-size="26" font-weight="700">Action</text>
    <text x="669" y="444" fill="#ede9fe" font-size="17">Autoriser puis</text>
    <text x="669" y="470" fill="#ede9fe" font-size="17">prouver l’effet</text>

    <circle cx="940" cy="350" r="22" fill="#ffedd5"/>
    <path d="M940 338v15M940 362v1" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
    <text x="931" y="407" fill="#9a3412" font-size="26" font-weight="700">Exception</text>
    <text x="931" y="444" fill="#7c2d12" font-size="17">Nommer l’état</text>
    <text x="931" y="470" fill="#7c2d12" font-size="17">et le blocage</text>

    <circle cx="1202" cy="350" r="22" fill="#d1fae5"/>
    <path d="M1212 345a13 13 0 1 0 1 12" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <path d="M1212 338v8h-8" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1193" y="407" fill="#065f46" font-size="26" font-weight="700">Reprise</text>
    <text x="1193" y="444" fill="#065f46" font-size="17">Réparer sans</text>
    <text x="1193" y="470" fill="#065f46" font-size="17">double effet</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="170" y="610" width="270" height="112" rx="22" fill="#ffffff" stroke="#d4d4d8"/>
    <circle cx="218" cy="666" r="23" fill="#eef2ff"/>
    <circle cx="218" cy="658" r="8" fill="#6366f1"/>
    <path d="M203 680c4-12 26-12 30 0" fill="#6366f1"/>
    <text x="258" y="657" fill="#18181b" font-size="21" font-weight="700">Rôle</text>
    <text x="258" y="687" fill="#52525b" font-size="16">Qui peut agir ?</text>

    <rect x="500" y="610" width="270" height="112" rx="22" fill="#ffffff" stroke="#d4d4d8"/>
    <circle cx="548" cy="666" r="23" fill="#eef2ff"/>
    <path d="M536 656h24v20h-24zM540 651h16" fill="none" stroke="#6366f1" stroke-width="3" stroke-linejoin="round"/>
    <text x="588" y="657" fill="#18181b" font-size="21" font-weight="700">Données</text>
    <text x="588" y="687" fill="#52525b" font-size="16">Qu’est-ce qui fait foi ?</text>

    <rect x="830" y="610" width="270" height="112" rx="22" fill="#ffffff" stroke="#d4d4d8"/>
    <circle cx="878" cy="666" r="23" fill="#eef2ff"/>
    <path d="M866 655h24v22h-24zM871 662h14M871 668h10" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    <text x="918" y="657" fill="#18181b" font-size="21" font-weight="700">Preuve</text>
    <text x="918" y="687" fill="#52525b" font-size="16">Quel effet conserver ?</text>

    <rect x="1160" y="610" width="270" height="112" rx="22" fill="#ffffff" stroke="#d4d4d8"/>
    <circle cx="1208" cy="666" r="23" fill="#eef2ff"/>
    <path d="M1196 664a12 12 0 0 1 24 0v11h-6v-10M1196 665v10h6" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
    <text x="1248" y="657" fill="#18181b" font-size="21" font-weight="700">Support</text>
    <text x="1248" y="687" fill="#52525b" font-size="16">Qui remet en état ?</text>
  </g>

  <path d="M305 610C305 555 415 550 520 510M635 610C635 560 700 545 748 510M965 610C965 555 1010 545 1010 510M1295 610C1295 555 1275 545 1272 510" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="110" y="820" fill="#71717a" font-family="Arial, Helvetica, sans-serif" font-size="17">Chaque case inconnue reste à définir : elle ne vaut ni autorisation, ni refus, ni zéro.</text>
</svg>
