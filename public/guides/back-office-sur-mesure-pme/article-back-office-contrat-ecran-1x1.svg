<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Contrat d’écran, format carré</title>
  <desc id="desc">Un parcours en cinq étapes relie file, fiche, action, exception et reprise. Quatre contrôles nomment le rôle, les données, la preuve et le support. La maquette utilise des données fictives.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafafa"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6366f1"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#312e81" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="930" cy="70" r="170" fill="#c4b5fd" opacity="0.2"/>
  <text x="70" y="82" fill="#4338ca" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">CONTRAT D’ÉCRAN</text>
  <text x="70" y="132" fill="#18181b" font-family="Georgia, serif" font-size="38" font-weight="700">Du travail à la reprise</text>
  <text x="70" y="170" fill="#52525b" font-family="Arial, Helvetica, sans-serif" font-size="18">Rôle · action · données · preuve · exception · reprise</text>
  <rect x="650" y="197" width="280" height="44" rx="22" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="790" y="225" text-anchor="middle" fill="#4338ca" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Maquette — données fictives</text>

  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="300" width="164" height="170" rx="22" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="244" y="300" width="164" height="170" rx="22" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="418" y="300" width="164" height="170" rx="22" fill="url(#main)"/>
    <rect x="592" y="300" width="164" height="170" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <rect x="766" y="300" width="164" height="170" rx="22" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow)"><path d="M234 385h5"/><path d="M408 385h5"/><path d="M582 385h5"/><path d="M756 385h5"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="98" y="367" fill="#18181b" font-size="22" font-weight="700">File</text><text x="98" y="402" fill="#52525b" font-size="14">Priorité</text><text x="98" y="424" fill="#52525b" font-size="14">et rôle</text>
    <text x="272" y="367" fill="#18181b" font-size="22" font-weight="700">Fiche</text><text x="272" y="402" fill="#52525b" font-size="14">État et</text><text x="272" y="424" fill="#52525b" font-size="14">source</text>
    <text x="446" y="367" fill="#ffffff" font-size="22" font-weight="700">Action</text><text x="446" y="402" fill="#ede9fe" font-size="14">Effet</text><text x="446" y="424" fill="#ede9fe" font-size="14">prouvé</text>
    <text x="620" y="367" fill="#9a3412" font-size="22" font-weight="700">Exception</text><text x="620" y="402" fill="#7c2d12" font-size="14">État et</text><text x="620" y="424" fill="#7c2d12" font-size="14">message</text>
    <text x="794" y="367" fill="#065f46" font-size="22" font-weight="700">Reprise</text><text x="794" y="402" fill="#065f46" font-size="14">Sans double</text><text x="794" y="424" fill="#065f46" font-size="14">effet</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="95" y="565" width="365" height="112" rx="22" fill="#ffffff" stroke="#d4d4d8"/><circle cx="140" cy="621" r="21" fill="#eef2ff"/><text x="178" y="612" fill="#18181b" font-size="20" font-weight="700">Rôle</text><text x="178" y="641" fill="#52525b" font-size="15">Qui peut agir, sur quel périmètre ?</text>
    <rect x="540" y="565" width="365" height="112" rx="22" fill="#ffffff" stroke="#d4d4d8"/><circle cx="585" cy="621" r="21" fill="#eef2ff"/><text x="623" y="612" fill="#18181b" font-size="20" font-weight="700">Données</text><text x="623" y="641" fill="#52525b" font-size="15">Qu’est-ce qui est nécessaire et fait foi ?</text>
    <rect x="95" y="707" width="365" height="112" rx="22" fill="#ffffff" stroke="#d4d4d8"/><circle cx="140" cy="763" r="21" fill="#eef2ff"/><text x="178" y="754" fill="#18181b" font-size="20" font-weight="700">Preuve</text><text x="178" y="783" fill="#52525b" font-size="15">Quel changement faut-il conserver ?</text>
    <rect x="540" y="707" width="365" height="112" rx="22" fill="#ffffff" stroke="#d4d4d8"/><circle cx="585" cy="763" r="21" fill="#eef2ff"/><text x="623" y="754" fill="#18181b" font-size="20" font-weight="700">Support</text><text x="623" y="783" fill="#52525b" font-size="15">Qui diagnostique et remet en état ?</text>
  </g>
  <g fill="none" stroke="#a5b4fc" stroke-width="3" stroke-dasharray="7 7"><path d="M278 565c0-50 60-65 80-95"/><path d="M722 565c0-50-60-65-80-95"/><path d="M278 707c0-110 145-155 222-237"/><path d="M722 707c0-110 100-155 126-237"/></g>
  <rect x="95" y="872" width="810" height="70" rx="22" fill="#312e81"/>
  <text x="500" y="901" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Une inconnue capable de changer l’option suspend la décision.</text>
  <text x="500" y="927" text-anchor="middle" fill="#c7d2fe" font-family="Arial, Helvetica, sans-serif" font-size="15">À définir ne vaut ni autorisation, ni refus, ni zéro.</text>
</svg>
