<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="1200"
  viewBox="0 0 1200 1200"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Le test de relève d’un logiciel métier</title>
  <desc id="desc">
    Cinq capacités vérifiées séparément conduisent à un procès-verbal de
    reprise.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b" />
      <stop offset=".62" stop-color="#111827" />
      <stop offset="1" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="8%" r="55%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".22" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)" />
  <rect width="1200" height="1200" fill="url(#glow)" />
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
