        TEST REJOUÉ
      </text>
    </g>
    <g transform="translate(76 538)">
      <rect width="1048" height="126" rx="25" fill="#18181b" stroke="#3f3f46" />
      <circle cx="62" cy="63" r="29" fill="#312e81" />
      <text
        x="62"
        y="71"
        fill="#c7d2fe"
        font-size="20"
        font-weight="800"
        text-anchor="middle"
      >
        03
      </text>
      <text x="116" y="57" fill="#fff" font-size="29" font-weight="750">
        Déployer
      </text>
      <text x="116" y="91" fill="#a1a1aa" font-size="18">
        Contrôles avant/après et retour arrière démontré
      </text>
      <text
        x="1000"
        y="72"
        fill="#a5b4fc"
        font-size="16"
        font-weight="750"
        text-anchor="end"
