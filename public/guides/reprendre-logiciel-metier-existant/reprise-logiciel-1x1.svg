      TEST DE RELÈVE · LOGICIEL MÉTIER
    </text>
    <text x="76" y="145" fill="#fff" font-size="46" font-weight="800">
      Cinq capacités avant la reprise
    </text>
    <text x="76" y="185" fill="#cbd5e1" font-size="21">
