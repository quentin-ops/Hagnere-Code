      </text>
      <text
        x="1000"
        y="72"
        fill="#a5b4fc"
        font-size="16"
        font-weight="750"
        text-anchor="end"
      >
        PREUVE DATÉE
      </text>
    </g>
    <g transform="translate(76 834)">
      <rect
        width="1048"
        height="126"
        rx="25"
        fill="#18181b"
        stroke="#f59e0b"
        stroke-opacity=".72"
      />
      <circle cx="62" cy="63" r="29" fill="#78350f" />
      <text
        x="62"
        y="71"
        fill="#fde68a"
        font-size="20"
        font-weight="800"
        text-anchor="middle"
      >
        05
      </text>
      <text x="116" y="57" fill="#fff" font-size="29" font-weight="750">
        Organiser la sortie
      </text>
      <text x="116" y="91" fill="#a1a1aa" font-size="18">
        Droits, données, comptes, restitution et révocations
      </text>
      <text
        x="1000"
        y="72"
        fill="#fde68a"
        font-size="16"
        font-weight="750"
        text-anchor="end"
