<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Cycle d'abonnement SaaS</title>
  <desc id="desc">Un événement mène à un état produit, un droit, un message et une action de correction. Les erreurs reviennent vers un état cohérent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#14253d"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="250" fill="#2563eb" opacity=".08"/>
  <circle cx="100" cy="790" r="230" fill="#06b6d4" opacity=".07"/>
  <text x="88" y="100" fill="#67e8f9" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">SCHÉMA DE DÉCISION</text>
  <text x="88" y="158" fill="#f8fafc" font-family="Arial, sans-serif" font-size="44" font-weight="700">L’abonnement ne décide pas seul du droit</text>
  <text x="88" y="200" fill="#a5b4c8" font-family="Arial, sans-serif" font-size="22">Le produit traduit chaque événement et prévoit les cas imparfaits.</text>
  <g font-family="Arial, sans-serif">
    <path d="M280 364H430M650 364H800" stroke="url(#flow)" stroke-width="7" marker-end="url(#arrow)"/>
    <g transform="translate(70 270)">
      <rect width="250" height="188" rx="28" fill="#10283e" stroke="#22d3ee" stroke-width="2"/>
      <text x="125" y="48" text-anchor="middle" fill="#67e8f9" font-size="16" font-weight="700" letter-spacing="2">01 · ÉVÉNEMENT</text>
      <text x="125" y="94" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Observable</text>
      <text x="125" y="130" text-anchor="middle" fill="#a5b4c8" font-size="17">activation · échec</text>
      <text x="125" y="158" text-anchor="middle" fill="#a5b4c8" font-size="17">doublon · résiliation</text>
    </g>
    <g transform="translate(440 270)">
      <rect width="250" height="188" rx="28" fill="#142743" stroke="#60a5fa" stroke-width="2"/>
      <text x="125" y="48" text-anchor="middle" fill="#93c5fd" font-size="16" font-weight="700" letter-spacing="2">02 · ÉTAT INTERNE</text>
      <text x="125" y="94" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Explicable</text>
      <text x="125" y="130" text-anchor="middle" fill="#a5b4c8" font-size="17">vocabulaire produit</text>
      <text x="125" y="158" text-anchor="middle" fill="#a5b4c8" font-size="17">indépendant du fournisseur</text>
    </g>
    <g transform="translate(810 270)">
      <rect width="320" height="188" rx="28" fill="#192440" stroke="#818cf8" stroke-width="2"/>
      <text x="160" y="48" text-anchor="middle" fill="#a5b4fc" font-size="16" font-weight="700" letter-spacing="2">03 · EFFET PRODUIT</text>
      <text x="160" y="94" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Droit + message</text>
      <text x="160" y="130" text-anchor="middle" fill="#a5b4c8" font-size="17">action autorisée ou refusée</text>
      <text x="160" y="158" text-anchor="middle" fill="#a5b4c8" font-size="17">prochaine action compréhensible</text>
    </g>
    <path d="M970 470v92c0 48-38 86-86 86H318" fill="none" stroke="#a78bfa" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
    <g transform="translate(168 565)">
      <rect width="660" height="164" rx="28" fill="#211f3c" stroke="#a78bfa" stroke-width="2"/>
      <text x="42" y="45" fill="#c4b5fd" font-size="16" font-weight="700" letter-spacing="2">04 · CORRECTION</text>
      <text x="42" y="88" fill="#fff" font-size="26" font-weight="700">Responsable, action, trace, retour cohérent</text>
      <text x="42" y="126" fill="#b8b6ca" font-size="18">L’échec conserve les données décidées et n’invente pas un deuxième droit.</text>
    </g>
    <rect x="864" y="588" width="266" height="112" rx="24" fill="#3b1724" stroke="#fb7185" stroke-width="2"/>
    <text x="997" y="632" text-anchor="middle" fill="#fecdd3" font-size="17" font-weight="700" letter-spacing="2">À DÉCIDER</text>
    <text x="997" y="669" text-anchor="middle" fill="#fff" font-size="19">reste un STOP visible</text>
  </g>
  <text x="88" y="824" fill="#8293a8" font-family="Arial, sans-serif" font-size="18">Exemple de structure · aucun fournisseur, statut ou délai imposé</text>
</svg>
