<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Matrice de décision Power Apps ou application sur mesure</title>
  <desc id="desc">Un dossier de preuves mène à cinq décisions possibles : suspendre, conserver, renforcer, hybrider ou reconstruire.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.6" stop-color="#18181b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#background)"/>
  <circle cx="1450" cy="100" r="260" fill="#7c3aed" opacity="0.16"/>
  <circle cx="90" cy="840" r="250" fill="#0284c7" opacity="0.12"/>

  <g transform="translate(84 68)">
    <rect width="54" height="54" rx="15" fill="url(#accent)"/>
    <text x="27" y="36" fill="#09090b" font-family="Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">HC</text>
    <text x="74" y="36" fill="#f4f4f5" font-family="Arial, sans-serif" font-size="30" font-weight="700">Hagnéré Code</text>
    <rect x="1150" y="0" width="280" height="54" rx="27" fill="#18181b" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <text x="1290" y="35" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Guide décisionnel 2026</text>
  </g>

  <text x="84" y="205" fill="#ffffff" font-family="Arial, sans-serif" font-size="62" font-weight="800">Power Apps ou application sur mesure ?</text>
  <text x="84" y="262" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="31">Partir des preuves, comparer quatre TCO, garder cinq sorties.</text>

  <g transform="translate(84 334)" filter="url(#shadow)">
    <rect width="1432" height="164" rx="26" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="34" y="48" fill="#a78bfa" font-family="Arial, sans-serif" font-size="24" font-weight="700">DOSSIER DE PREUVES</text>
    <g font-family="Arial, sans-serif" font-size="25" fill="#f4f4f5">
      <text x="34" y="104">Besoin &amp; données</text>
      <text x="330" y="104">Audience &amp; identité</text>
      <text x="645" y="104">UX &amp; hors-ligne</text>
      <text x="930" y="104">DLP &amp; ALM</text>
      <text x="1172" y="104">Sortie &amp; support</text>
    </g>
    <g fill="#8b5cf6">
      <circle cx="286" cy="96" r="6"/>
      <circle cx="600" cy="96" r="6"/>
      <circle cx="886" cy="96" r="6"/>
      <circle cx="1128" cy="96" r="6"/>
    </g>
  </g>

  <path d="M800 514V562" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M782 548L800 568L818 548" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(84 596)" font-family="Arial, sans-serif">
    <g transform="translate(0 0)">
      <rect width="256" height="202" rx="24" fill="#f59e0b" fill-opacity="0.13" stroke="#fbbf24" stroke-opacity="0.7"/>
      <text x="26" y="52" fill="#fbbf24" font-size="24" font-weight="800">SUSPENDRE</text>
      <text x="26" y="99" fill="#ffffff" font-size="30" font-weight="700">Prouver</text>
      <text x="26" y="137" fill="#ffffff" font-size="30" font-weight="700">avant de choisir</text>
      <text x="26" y="174" fill="#d4d4d8" font-size="20">Inconnue critique</text>
    </g>
    <g transform="translate(294 0)">
      <rect width="256" height="202" rx="24" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.65"/>
      <text x="26" y="52" fill="#34d399" font-size="24" font-weight="800">CONSERVER</text>
      <text x="26" y="99" fill="#ffffff" font-size="30" font-weight="700">Power Apps</text>
      <text x="26" y="137" fill="#ffffff" font-size="30" font-weight="700">est défendable</text>
      <text x="26" y="174" fill="#d4d4d8" font-size="20">Preuves positives</text>
    </g>
    <g transform="translate(588 0)">
      <rect width="256" height="202" rx="24" fill="#6366f1" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.7"/>
      <text x="26" y="52" fill="#a5b4fc" font-size="24" font-weight="800">RENFORCER</text>
      <text x="26" y="99" fill="#ffffff" font-size="30" font-weight="700">Corriger</text>
      <text x="26" y="137" fill="#ffffff" font-size="30" font-weight="700">l’architecture</text>
      <text x="26" y="174" fill="#d4d4d8" font-size="20">Défaut remédiable</text>
    </g>
    <g transform="translate(882 0)">
      <rect width="256" height="202" rx="24" fill="#0ea5e9" fill-opacity="0.13" stroke="#38bdf8" stroke-opacity="0.7"/>
      <text x="26" y="52" fill="#7dd3fc" font-size="24" font-weight="800">HYBRIDE</text>
      <text x="26" y="99" fill="#ffffff" font-size="30" font-weight="700">Isoler</text>
      <text x="26" y="137" fill="#ffffff" font-size="30" font-weight="700">la contrainte</text>
      <text x="26" y="174" fill="#d4d4d8" font-size="20">Frontière propre</text>
    </g>
    <g transform="translate(1176 0)">
      <rect width="256" height="202" rx="24" fill="#a855f7" fill-opacity="0.13" stroke="#c084fc" stroke-opacity="0.7"/>
      <text x="26" y="52" fill="#d8b4fe" font-size="24" font-weight="800">DÉDIÉ</text>
      <text x="26" y="99" fill="#ffffff" font-size="30" font-weight="700">Reconstruire</text>
      <text x="26" y="137" fill="#ffffff" font-size="30" font-weight="700">progressivement</text>
      <text x="26" y="174" fill="#d4d4d8" font-size="20">Limite reproduite</text>
    </g>
  </g>
</svg>
