      <text x="22" y="94" fill="#fff" font-size="27" font-weight="700">Séparer</text>
      <text x="22" y="130" fill="#fff" font-size="27" font-weight="700">la limite</text>
      <text x="22" y="166" fill="#d4d4d8" font-size="18">Frontière testée</text>
