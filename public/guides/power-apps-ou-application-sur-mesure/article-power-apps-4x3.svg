      <text x="22" y="48" fill="#d8b4fe" font-size="22" font-weight="800">DÉDIÉ</text>
      <text x="22" y="94" fill="#fff" font-size="27" font-weight="700">Reconstruire</text>
      <text x="22" y="130" fill="#fff" font-size="27" font-weight="700">Retour testé</text>
      <text x="22" y="166" fill="#d4d4d8" font-size="18">Limite prouvée</text>
