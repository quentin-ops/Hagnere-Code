      <text x="400" y="102">Audience &amp; identité</text>
      <text x="740" y="102">Hors-ligne &amp; UX</text>
      <text x="32" y="158">Licences &amp; DLP</text>
      <text x="400" y="158">ALM &amp; support</text>
      <text x="740" y="158">Restauration &amp; sortie</text>
    </g>
  </g>

  <path d="M600 518V566" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M582 552L600 572L618 552" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(68 600)" font-family="Arial, sans-serif">
    <g>
