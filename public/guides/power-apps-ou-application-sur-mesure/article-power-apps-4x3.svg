<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Dossier de décision Power Apps</title>
  <desc id="desc">Une matrice relie preuves, coût complet et cinq décisions possibles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a09"/>
      <stop offset="0.55" stop-color="#18181b"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1120" cy="30" r="260" fill="#7c3aed" opacity="0.15"/>
  <g transform="translate(68 58)" font-family="Arial, sans-serif">
    <rect width="50" height="50" rx="14" fill="url(#line)"/>
    <text x="25" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#09090b">HC</text>
    <text x="70" y="34" font-size="28" font-weight="700" fill="#fafafa">Hagnéré Code</text>
  </g>
  <text x="68" y="180" fill="#ffffff" font-family="Arial, sans-serif" font-size="56" font-weight="800">Power Apps ou sur mesure ?</text>
  <text x="68" y="230" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="28">Le dossier qui interdit les raccourcis.</text>

  <g transform="translate(68 292)" font-family="Arial, sans-serif">
    <rect width="1064" height="208" rx="26" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="32" y="50" fill="#a78bfa" font-size="22" font-weight="800">PREUVES À RÉUNIR</text>
    <g fill="#f4f4f5" font-size="25">
