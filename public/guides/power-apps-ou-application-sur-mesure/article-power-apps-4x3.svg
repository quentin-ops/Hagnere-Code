      <text x="22" y="48" fill="#fbbf24" font-size="22" font-weight="800">SUSPENDRE</text>
      <text x="22" y="94" fill="#fff" font-size="27" font-weight="700">Preuve</text>
      <text x="22" y="130" fill="#fff" font-size="27" font-weight="700">manquante</text>
      <text x="22" y="166" fill="#d4d4d8" font-size="18">Pas de verdict</text>
    </g>
    <g transform="translate(218)">
      <rect width="194" height="192" rx="22" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.7"/>
      <text x="22" y="48" fill="#34d399" font-size="22" font-weight="800">GARDER</text>
      <text x="22" y="94" fill="#fff" font-size="27" font-weight="700">Power Apps</text>
      <text x="22" y="130" fill="#fff" font-size="27" font-weight="700">fonctionne</text>
      <text x="22" y="166" fill="#d4d4d8" font-size="18">Preuves datées</text>
    </g>
    <g transform="translate(436)">
      <rect width="194" height="192" rx="22" fill="#6366f1" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.7"/>
      <text x="22" y="48" fill="#a5b4fc" font-size="22" font-weight="800">RENFORCER</text>
      <text x="22" y="94" fill="#fff" font-size="27" font-weight="700">Corriger</text>
      <text x="22" y="130" fill="#fff" font-size="27" font-weight="700">avant sortie</text>
      <text x="22" y="166" fill="#d4d4d8" font-size="18">Défaut borné</text>
    </g>
    <g transform="translate(654)">
