<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="1000"
  viewBox="0 0 1000 1000"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Une migration métier avec retour préparé</title>
  <desc id="desc">
    Un trajet vertical relie l’ancien logiciel au nouveau par un passage
    contrôlé. La source d’écriture reste unique, un seuil GO ou STOP protège la
    bascule et un trajet de retour est visible.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18" />
      <stop offset=".56" stop-color="#111833" />
      <stop offset="1" stop-color="#101c2d" />
    </linearGradient>
    <radialGradient id="glow" cx="52%" cy="52%" r="62%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".22" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81" />
      <stop offset=".55" stop-color="#4338ca" />
      <stop offset="1" stop-color="#155e75" />
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b" />
      <stop offset="1" stop-color="#065f46" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="14"
        stdDeviation="17"
        flood-color="#020617"
        flood-opacity=".5"
      />
    </filter>
    <marker
      id="arrowIndigo"
      viewBox="0 0 12 12"
      refX="10"
      refY="6"
      markerWidth="9"
      markerHeight="9"
      orient="auto-start-reverse"
    >
      <path d="M1 1 11 6 1 11Z" fill="#818cf8" />
    </marker>
    <marker
      id="arrowAmber"
      viewBox="0 0 12 12"
      refX="10"
      refY="6"
      markerWidth="9"
      markerHeight="9"
      orient="auto-start-reverse"
    >
      <path d="M1 1 11 6 1 11Z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)" />
  <rect width="1000" height="1000" fill="url(#glow)" />
  <circle
    cx="918"
    cy="52"
    r="124"
    fill="none"
    stroke="#34d399"
    stroke-opacity=".08"
    stroke-width="2"
  />
  <circle
    cx="90"
    cy="920"
    r="150"
    fill="none"
    stroke="#f59e0b"
    stroke-opacity=".07"
    stroke-width="2"
  />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text
      x="58"
      y="62"
      fill="#fbbf24"
      font-size="17"
      font-weight="760"
      letter-spacing="3"
    >
      MIGRATION RÉVERSIBLE
    </text>
    <text x="58" y="116" fill="#f8fafc" font-size="40" font-weight="830">
      Une bascule qui sait revenir
    </text>
    <text x="58" y="152" fill="#cbd5e1" font-size="19">
      Une source d’écriture. Des preuves. Un trajet de retour.
    </text>

    <g transform="translate(58 205)" filter="url(#shadow)">
      <rect
        width="364"
        height="176"
        rx="25"
        fill="#171927"
        stroke="#f59e0b"
        stroke-opacity=".6"
        stroke-width="2"
      />
      <rect x="22" y="22" width="56" height="56" rx="16" fill="#422006" />
      <path
        d="M38 39h24v22H38zM34 67h32"
        fill="none"
        stroke="#fbbf24"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="3.5"
      />
      <text
        x="340"
        y="43"
        fill="#fbbf24"
        font-size="13"
        font-weight="820"
        text-anchor="end"
        letter-spacing="1"
      >
        RETOUR PRÊT
      </text>
      <text x="22" y="114" fill="#f8fafc" font-size="27" font-weight="790">
        Ancien logiciel
      </text>
      <circle cx="28" cy="145" r="6" fill="#f59e0b" />
      <text x="44" y="151" fill="#fde68a" font-size="16" font-weight="680">
        Écriture après STOP
      </text>
    </g>

    <path
      d="M438 291H491"
      fill="none"
      stroke="#818cf8"
      stroke-linecap="round"
      stroke-width="6"
      marker-end="url(#arrowIndigo)"
    />

    <g transform="translate(500 186)" filter="url(#shadow)">
      <rect
        width="442"
        height="214"
        rx="28"
        fill="#11162b"
        stroke="#818cf8"
        stroke-opacity=".76"
        stroke-width="2"
      />
      <rect x="18" y="18" width="406" height="63" rx="18" fill="url(#bridge)" />
      <text
        x="221"
        y="45"
        fill="#e0e7ff"
        font-size="13"
        font-weight="830"
        text-anchor="middle"
        letter-spacing="1.5"
      >
        PASSAGE CONTRÔLÉ
      </text>
      <text
        x="221"
        y="67"
        fill="#fff"
        font-size="18"
        font-weight="750"
        text-anchor="middle"
      >
        Source d’écriture unique
      </text>

      <g transform="translate(30 104)">
        <circle cx="27" cy="27" r="27" fill="#26245b" stroke="#6366f1" />
        <text
          x="27"
          y="34"
          fill="#c7d2fe"
          font-size="17"
          font-weight="850"
          text-anchor="middle"
        >
          1
        </text>
        <text x="27" y="75" fill="#cbd5e1" font-size="14" text-anchor="middle">
          Geler
        </text>
      </g>
      <path
        d="M94 131h41"
        fill="none"
        stroke="#4f46e5"
        stroke-width="3.5"
        marker-end="url(#arrowIndigo)"
      />
      <g transform="translate(137 104)">
        <circle cx="27" cy="27" r="27" fill="#26245b" stroke="#6366f1" />
        <text
          x="27"
          y="34"
          fill="#c7d2fe"
          font-size="17"
          font-weight="850"
          text-anchor="middle"
        >
          2
        </text>
        <text x="27" y="75" fill="#cbd5e1" font-size="14" text-anchor="middle">
          Copier
        </text>
      </g>
      <path
        d="M201 131h41"
        fill="none"
        stroke="#4f46e5"
        stroke-width="3.5"
        marker-end="url(#arrowIndigo)"
      />
      <g transform="translate(244 104)">
        <circle cx="27" cy="27" r="27" fill="#164e63" stroke="#22d3ee" />
        <path
          d="m16 27 8 8 16-19"
          fill="none"
          stroke="#a5f3fc"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="3.5"
        />
        <text x="27" y="75" fill="#cbd5e1" font-size="14" text-anchor="middle">
          Prouver
        </text>
      </g>
      <g transform="translate(327 104)">
        <rect width="85" height="68" rx="17" fill="#3b1013" stroke="#ef4444" />
        <text
          x="42.5"
          y="27"
          fill="#fca5a5"
          font-size="12"
          font-weight="850"
          text-anchor="middle"
        >
          DOUTE
        </text>
        <text
          x="42.5"
          y="52"
          fill="#fff"
          font-size="20"
          font-weight="850"
          text-anchor="middle"
        >
          STOP
        </text>
      </g>
    </g>

    <path
      d="M721 416V477"
      fill="none"
      stroke="#34d399"
      stroke-linecap="round"
      stroke-width="6"
      marker-end="url(#arrowIndigo)"
    />

    <g transform="translate(500 490)" filter="url(#shadow)">
      <rect
        width="442"
        height="176"
        rx="25"
        fill="#111f25"
        stroke="#34d399"
        stroke-opacity=".72"
        stroke-width="2"
      />
      <rect x="22" y="22" width="56" height="56" rx="16" fill="#064e3b" />
      <path
        d="m36 50 10 10 20-24"
        fill="none"
        stroke="#6ee7b7"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="4"
      />
      <text
        x="418"
        y="43"
        fill="#6ee7b7"
        font-size="13"
        font-weight="820"
        text-anchor="end"
        letter-spacing="1"
      >
        APRÈS DÉCISION
      </text>
      <text x="22" y="114" fill="#f8fafc" font-size="27" font-weight="790">
        Nouveau logiciel
      </text>
      <circle cx="28" cy="145" r="6" fill="#34d399" />
      <text x="44" y="151" fill="#a7f3d0" font-size="16" font-weight="680">
        Écriture après GO
      </text>
    </g>

    <path
      d="M500 589C440 620 420 692 380 744 316 827 211 815 176 736 142 658 179 492 240 398"
      fill="none"
      stroke="#f59e0b"
      stroke-dasharray="10 10"
      stroke-linecap="round"
      stroke-width="4"
      marker-end="url(#arrowAmber)"
    />
    <g transform="translate(58 478)" filter="url(#shadow)">
      <rect width="358" height="202" rx="27" fill="#251a12" stroke="#f59e0b" />
      <text
        x="26"
        y="39"
        fill="#fde68a"
        font-size="14"
        font-weight="830"
        letter-spacing="1.2"
      >
        TRAJET DE RETOUR
      </text>
      <text x="26" y="78" fill="#fff" font-size="24" font-weight="770">
        Répété avant le GO
      </text>
      <line x1="26" y1="101" x2="332" y2="101" stroke="#78350f" />
      <text x="26" y="134" fill="#fcd34d" font-size="16" font-weight="720">
        Restauration démontrée
      </text>
      <text x="26" y="163" fill="#fcd34d" font-size="16" font-weight="720">
        Écarts consignés
      </text>
      <text x="26" y="190" fill="#fcd34d" font-size="16" font-weight="720">
        Responsable nommé
      </text>
    </g>

    <g transform="translate(484 719)">
      <rect width="458" height="116" rx="25" fill="#0e1628" stroke="#334155" />
      <text
        x="229"
        y="30"
        fill="#a5b4fc"
        font-size="13"
        font-weight="820"
        text-anchor="middle"
        letter-spacing="1.2"
      >
        PREUVES + MARGE DE RETOUR
      </text>
      <rect x="104" y="49" width="250" height="48" rx="15" fill="url(#go)" stroke="#34d399" />
      <text
        x="229"
        y="80"
        fill="#fff"
        font-size="21"
        font-weight="850"
        text-anchor="middle"
      >
        GO CANDIDAT
      </text>
    </g>

    <g transform="translate(58 895)">
      <line x1="0" y1="0" x2="884" y2="0" stroke="#334155" stroke-width="2" />
      <text x="0" y="35" fill="#94a3b8" font-size="16">
        Continuité encadrée, pas promesse de zéro coupure.
      </text>
      <text
        x="884"
        y="35"
        fill="#a5b4fc"
        font-size="15"
        font-weight="760"
        text-anchor="end"
      >
        LE GO RESTE HUMAIN
      </text>
    </g>
  </g>
</svg>
