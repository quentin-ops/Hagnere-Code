<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="900"
  viewBox="0 0 1200 900"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Le passage contrôlé d’un logiciel métier à un autre</title>
  <desc id="desc">
    L’ancien et le nouveau logiciel sont reliés par un passage contrôlé avec
    source d’écriture unique, seuil GO ou STOP et trajet de retour testé.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18" />
      <stop offset=".55" stop-color="#111833" />
      <stop offset="1" stop-color="#101c2d" />
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="50%" r="58%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".2" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81" />
      <stop offset=".55" stop-color="#4338ca" />
      <stop offset="1" stop-color="#155e75" />
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b" />
      <stop offset="1" stop-color="#065f46" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="15"
        stdDeviation="18"
        flood-color="#020617"
        flood-opacity=".48"
      />
    </filter>
    <marker
      id="arrowIndigo"
      viewBox="0 0 12 12"
      refX="10"
      refY="6"
      markerWidth="9"
      markerHeight="9"
      orient="auto-start-reverse"
    >
      <path d="M1 1 11 6 1 11Z" fill="#818cf8" />
    </marker>
    <marker
      id="arrowAmber"
      viewBox="0 0 12 12"
      refX="10"
      refY="6"
      markerWidth="9"
      markerHeight="9"
      orient="auto-start-reverse"
    >
      <path d="M1 1 11 6 1 11Z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />
  <rect width="1200" height="900" fill="url(#glow)" />
  <circle
    cx="1100"
    cy="45"
    r="130"
    fill="none"
    stroke="#34d399"
    stroke-opacity=".08"
    stroke-width="2"
  />
  <path
    d="M-40 790C242 667 357 876 616 767s424-68 630 8"
    fill="none"
    stroke="#94a3b8"
    stroke-opacity=".05"
    stroke-width="2"
  />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text
      x="64"
      y="72"
      fill="#fbbf24"
      font-size="18"
      font-weight="750"
      letter-spacing="3.5"
    >
      MIGRATION RÉVERSIBLE
    </text>
    <text x="64" y="130" fill="#f8fafc" font-size="44" font-weight="820">
      Une bascule qui sait revenir
    </text>
    <text x="64" y="169" fill="#cbd5e1" font-size="21">
      Continuité encadrée, jamais deux sources d’écriture.
    </text>

    <g transform="translate(64 246)" filter="url(#shadow)">
      <rect
        width="274"
        height="250"
        rx="27"
        fill="#171927"
        stroke="#f59e0b"
        stroke-opacity=".58"
        stroke-width="2"
      />
      <rect x="24" y="24" width="60" height="60" rx="17" fill="#422006" />
      <path
        d="M41 42h26v24H41zM37 72h34"
        fill="none"
        stroke="#fbbf24"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="3.5"
      />
      <text x="24" y="129" fill="#f8fafc" font-size="27" font-weight="780">
        Ancien logiciel
      </text>
      <text x="24" y="166" fill="#aeb8cc" font-size="17">
        Retour testé
      </text>
      <rect x="24" y="193" width="226" height="38" rx="11" fill="#251a12" />
      <circle cx="44" cy="212" r="6" fill="#f59e0b" />
      <text x="60" y="219" fill="#fde68a" font-size="15" font-weight="680">
        Écriture après STOP
      </text>
    </g>

    <path
      d="M350 370H407"
      fill="none"
      stroke="#818cf8"
      stroke-linecap="round"
      stroke-width="6"
      marker-end="url(#arrowIndigo)"
    />

    <g transform="translate(414 215)" filter="url(#shadow)">
      <rect
        width="372"
        height="312"
        rx="31"
        fill="#11162b"
        stroke="#818cf8"
        stroke-opacity=".75"
        stroke-width="2"
      />
      <rect x="18" y="18" width="336" height="70" rx="19" fill="url(#bridge)" />
      <text
        x="186"
        y="48"
        fill="#e0e7ff"
        font-size="14"
        font-weight="820"
        text-anchor="middle"
        letter-spacing="1.8"
      >
        PASSAGE CONTRÔLÉ
      </text>
      <text
        x="186"
        y="72"
        fill="#fff"
        font-size="18"
        font-weight="750"
        text-anchor="middle"
      >
        Source d’écriture unique
      </text>

      <g transform="translate(28 116)">
        <circle cx="34" cy="34" r="34" fill="#26245b" stroke="#6366f1" />
        <text
          x="34"
          y="41"
          fill="#c7d2fe"
          font-size="19"
          font-weight="850"
          text-anchor="middle"
        >
          1
        </text>
        <text x="34" y="89" fill="#cbd5e1" font-size="16" text-anchor="middle">
          Geler
        </text>
      </g>
      <path
        d="M103 150h38"
        fill="none"
        stroke="#4f46e5"
        stroke-width="4"
        marker-end="url(#arrowIndigo)"
      />
      <g transform="translate(143 116)">
        <circle cx="34" cy="34" r="34" fill="#26245b" stroke="#6366f1" />
        <text
          x="34"
          y="41"
          fill="#c7d2fe"
          font-size="19"
          font-weight="850"
          text-anchor="middle"
        >
          2
        </text>
        <text x="34" y="89" fill="#cbd5e1" font-size="16" text-anchor="middle">
          Copier
        </text>
      </g>
      <path
        d="M212 150h38"
        fill="none"
        stroke="#4f46e5"
        stroke-width="4"
        marker-end="url(#arrowIndigo)"
      />
      <g transform="translate(252 116)">
        <circle cx="34" cy="34" r="34" fill="#164e63" stroke="#22d3ee" />
        <path
          d="m20 34 9 9 20-22"
          fill="none"
          stroke="#a5f3fc"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="4"
        />
        <text x="34" y="89" fill="#cbd5e1" font-size="16" text-anchor="middle">
          Prouver
        </text>
      </g>

      <g transform="translate(28 235)">
        <rect width="143" height="54" rx="15" fill="#3b1013" stroke="#ef4444" />
        <text
          x="71.5"
          y="22"
          fill="#fca5a5"
          font-size="12"
          font-weight="850"
          text-anchor="middle"
        >
          DOUTE
        </text>
        <text
          x="71.5"
          y="44"
          fill="#fff"
          font-size="21"
          font-weight="850"
          text-anchor="middle"
        >
          STOP
        </text>
      </g>
      <g transform="translate(187 235)">
        <rect width="157" height="54" rx="15" fill="url(#go)" stroke="#34d399" />
        <text
          x="78.5"
          y="22"
          fill="#a7f3d0"
          font-size="12"
          font-weight="850"
          text-anchor="middle"
        >
          PREUVES
        </text>
        <text
          x="78.5"
          y="44"
          fill="#fff"
          font-size="20"
          font-weight="850"
          text-anchor="middle"
        >
          GO CANDIDAT
        </text>
      </g>
    </g>

    <path
      d="M798 370H855"
      fill="none"
      stroke="#34d399"
      stroke-linecap="round"
      stroke-width="6"
      marker-end="url(#arrowIndigo)"
    />

    <g transform="translate(862 246)" filter="url(#shadow)">
      <rect
        width="274"
        height="250"
        rx="27"
        fill="#111f25"
        stroke="#34d399"
        stroke-opacity=".7"
        stroke-width="2"
      />
      <rect x="24" y="24" width="60" height="60" rx="17" fill="#064e3b" />
      <path
        d="m39 54 10 10 21-25"
        fill="none"
        stroke="#6ee7b7"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="4"
      />
      <text x="24" y="129" fill="#f8fafc" font-size="27" font-weight="780">
        Nouveau logiciel
      </text>
      <text x="24" y="166" fill="#aeb8cc" font-size="17">
        Parcours contrôlés
      </text>
      <rect x="24" y="193" width="226" height="38" rx="11" fill="#0c3028" />
      <circle cx="44" cy="212" r="6" fill="#34d399" />
      <text x="60" y="219" fill="#a7f3d0" font-size="15" font-weight="680">
        Écriture après GO
      </text>
    </g>

    <path
      d="M1002 525C955 660 754 686 594 639 428 591 228 624 197 521"
      fill="none"
      stroke="#f59e0b"
      stroke-dasharray="10 10"
      stroke-linecap="round"
      stroke-width="4"
      marker-end="url(#arrowAmber)"
    />
    <g transform="translate(432 604)">
      <rect width="336" height="76" rx="21" fill="#251a12" stroke="#f59e0b" />
      <path
        d="M28 39h23m-8-9 9 9-9 9"
        fill="none"
        stroke="#fbbf24"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="3"
      />
      <text x="68" y="32" fill="#fde68a" font-size="14" font-weight="820">
        TRAJET DE RETOUR
      </text>
      <text x="68" y="57" fill="#fff" font-size="19" font-weight="750">
        Répété avant la bascule
      </text>
    </g>

    <g transform="translate(64 769)">
      <rect width="1072" height="72" rx="20" fill="#0e1628" stroke="#334155" />
      <circle cx="38" cy="36" r="7" fill="#818cf8" />
      <text x="58" y="32" fill="#f8fafc" font-size="17" font-weight="720">
        Le GO reste humain.
      </text>
      <text x="58" y="54" fill="#94a3b8" font-size="15">
        Il s’appuie sur des preuves datées et une marge de retour.
      </text>
      <text
        x="1036"
        y="43"
        fill="#a5b4fc"
        font-size="16"
        font-weight="760"
        text-anchor="end"
      >
        ICI OU LÀ — JAMAIS AUX DEUX
      </text>
    </g>
  </g>
</svg>
