<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="900"
  viewBox="0 0 1600 900"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Une migration réversible de logiciel métier</title>
  <desc id="desc">
    L’ancien logiciel mène vers un passage contrôlé puis vers le nouveau
    logiciel. Une seule source reste autorisée à écrire, une décision GO ou STOP
    est prise sur preuves et un trajet de retour est préparé.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18" />
      <stop offset=".52" stop-color="#111833" />
      <stop offset="1" stop-color="#101c2d" />
    </linearGradient>
    <radialGradient id="indigoGlow" cx="52%" cy="48%" r="52%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".2" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberGlow" cx="10%" cy="85%" r="44%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".13" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#312e81" />
      <stop offset=".54" stop-color="#4338ca" />
      <stop offset="1" stop-color="#155e75" />
    </linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b" />
      <stop offset="1" stop-color="#065f46" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="22"
        flood-color="#020617"
        flood-opacity=".5"
      />
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="12"
        flood-color="#020617"
        flood-opacity=".32"
      />
    </filter>
    <marker
      id="arrowIndigo"
      viewBox="0 0 12 12"
      refX="10"
      refY="6"
      markerWidth="10"
      markerHeight="10"
      orient="auto-start-reverse"
    >
      <path d="M1 1 11 6 1 11Z" fill="#818cf8" />
    </marker>
    <marker
      id="arrowAmber"
      viewBox="0 0 12 12"
      refX="10"
      refY="6"
      markerWidth="10"
      markerHeight="10"
      orient="auto-start-reverse"
    >
      <path d="M1 1 11 6 1 11Z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#indigoGlow)" />
  <rect width="1600" height="900" fill="url(#amberGlow)" />
  <path
    d="M-40 735C315 618 398 885 762 759s530-60 900 45"
    fill="none"
    stroke="#94a3b8"
    stroke-opacity=".05"
    stroke-width="2"
  />
  <circle
    cx="1450"
    cy="72"
    r="170"
    fill="none"
    stroke="#34d399"
    stroke-opacity=".08"
    stroke-width="2"
  />
  <circle
    cx="1450"
    cy="72"
    r="116"
    fill="none"
    stroke="#34d399"
    stroke-opacity=".08"
    stroke-width="2"
  />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text
      x="86"
      y="84"
      fill="#fbbf24"
      font-size="21"
      font-weight="750"
      letter-spacing="4"
    >
      MIGRATION RÉVERSIBLE · LOGICIEL MÉTIER
    </text>
    <text x="86" y="150" fill="#f8fafc" font-size="52" font-weight="820">
      Une bascule qui sait revenir
    </text>
    <text x="86" y="195" fill="#cbd5e1" font-size="23">
      Continuité encadrée, pas promesse de zéro coupure.
    </text>

    <g transform="translate(86 282)" filter="url(#shadow)">
      <rect
        width="350"
        height="280"
        rx="30"
        fill="#171927"
        stroke="#f59e0b"
        stroke-opacity=".56"
        stroke-width="2"
      />
      <rect x="28" y="28" width="70" height="70" rx="20" fill="#422006" />
      <path
        d="M48 50h30v27H48zM43 83h40"
        fill="none"
        stroke="#fbbf24"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="4"
      />
      <text
        x="322"
        y="52"
        fill="#fbbf24"
        font-size="15"
        font-weight="800"
        text-anchor="end"
        letter-spacing="1.5"
      >
        POINT DE RETOUR
      </text>
      <text x="28" y="146" fill="#f8fafc" font-size="32" font-weight="780">
        Ancien logiciel
      </text>
      <text x="28" y="186" fill="#aeb8cc" font-size="19">
        Restauré et redémarrable
      </text>
      <rect x="28" y="218" width="294" height="40" rx="12" fill="#251a12" />
      <circle cx="50" cy="238" r="7" fill="#f59e0b" />
      <text x="69" y="245" fill="#fde68a" font-size="17" font-weight="680">
        Écriture désactivée après GO
      </text>
    </g>

    <path
      d="M453 422H540"
      fill="none"
      stroke="#818cf8"
      stroke-width="7"
      stroke-linecap="round"
      marker-end="url(#arrowIndigo)"
    />

    <g transform="translate(545 248)" filter="url(#shadow)">
      <rect
        width="510"
        height="348"
        rx="36"
        fill="#11162b"
        stroke="#818cf8"
        stroke-opacity=".72"
        stroke-width="2"
      />
      <rect x="20" y="20" width="470" height="70" rx="20" fill="url(#bridge)" />
      <text
        x="255"
        y="51"
        fill="#e0e7ff"
        font-size="15"
        font-weight="800"
        text-anchor="middle"
        letter-spacing="2"
      >
        PASSAGE CONTRÔLÉ
      </text>
      <text
        x="255"
        y="76"
        fill="#fff"
        font-size="21"
        font-weight="750"
        text-anchor="middle"
      >
        Une seule source d’écriture
      </text>

      <g transform="translate(30 124)">
        <circle cx="36" cy="36" r="36" fill="#26245b" stroke="#6366f1" />
        <text
          x="36"
          y="43"
          fill="#c7d2fe"
          font-size="20"
          font-weight="850"
          text-anchor="middle"
        >
          1
        </text>
        <text x="36" y="97" fill="#cbd5e1" font-size="17" text-anchor="middle">
          Geler
        </text>
      </g>
      <path
        d="M115 160h68"
        fill="none"
        stroke="#4f46e5"
        stroke-width="4"
        stroke-linecap="round"
        marker-end="url(#arrowIndigo)"
      />
      <g transform="translate(185 124)">
        <circle cx="36" cy="36" r="36" fill="#26245b" stroke="#6366f1" />
        <text
          x="36"
          y="43"
          fill="#c7d2fe"
          font-size="20"
          font-weight="850"
          text-anchor="middle"
        >
          2
        </text>
        <text x="36" y="97" fill="#cbd5e1" font-size="17" text-anchor="middle">
          Copier
        </text>
      </g>
      <path
        d="M270 160h68"
        fill="none"
        stroke="#4f46e5"
        stroke-width="4"
        stroke-linecap="round"
        marker-end="url(#arrowIndigo)"
      />
      <g transform="translate(340 124)">
        <circle cx="36" cy="36" r="36" fill="#164e63" stroke="#22d3ee" />
        <path
          d="m21 36 10 10 21-24"
          fill="none"
          stroke="#a5f3fc"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="5"
        />
        <text x="36" y="97" fill="#cbd5e1" font-size="17" text-anchor="middle">
          Prouver
        </text>
      </g>

      <line
        x1="30"
        y1="244"
        x2="480"
        y2="244"
        stroke="#334155"
        stroke-width="2"
      />
      <g transform="translate(30 266)">
        <rect width="206" height="58" rx="16" fill="#3b1013" stroke="#ef4444" />
        <text
          x="103"
          y="24"
          fill="#fca5a5"
          font-size="13"
          font-weight="850"
          text-anchor="middle"
          letter-spacing="1"
        >
          PREUVE MANQUANTE
        </text>
        <text
          x="103"
          y="47"
          fill="#fff"
          font-size="22"
          font-weight="850"
          text-anchor="middle"
        >
          STOP
        </text>
      </g>
      <g transform="translate(254 266)">
        <rect width="226" height="58" rx="16" fill="url(#go)" stroke="#34d399" />
        <text
          x="113"
          y="24"
          fill="#a7f3d0"
          font-size="13"
          font-weight="850"
          text-anchor="middle"
          letter-spacing="1"
        >
          PREUVES + MARGE
        </text>
        <text
          x="113"
          y="47"
          fill="#fff"
          font-size="22"
          font-weight="850"
          text-anchor="middle"
        >
          GO CANDIDAT
        </text>
      </g>
    </g>

    <path
      d="M1069 422H1154"
      fill="none"
      stroke="#34d399"
      stroke-width="7"
      stroke-linecap="round"
      marker-end="url(#arrowIndigo)"
    />

    <g transform="translate(1164 282)" filter="url(#shadow)">
      <rect
        width="350"
        height="280"
        rx="30"
        fill="#111f25"
        stroke="#34d399"
        stroke-opacity=".68"
        stroke-width="2"
      />
      <rect x="28" y="28" width="70" height="70" rx="20" fill="#064e3b" />
      <path
        d="m46 64 12 12 25-29"
        fill="none"
        stroke="#6ee7b7"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="5"
      />
      <text
        x="322"
        y="52"
        fill="#6ee7b7"
        font-size="15"
        font-weight="800"
        text-anchor="end"
        letter-spacing="1.5"
      >
        APRÈS DÉCISION
      </text>
      <text x="28" y="146" fill="#f8fafc" font-size="32" font-weight="780">
        Nouveau logiciel
      </text>
      <text x="28" y="186" fill="#aeb8cc" font-size="19">
        Parcours critiques contrôlés
      </text>
      <rect x="28" y="218" width="294" height="40" rx="12" fill="#0c3028" />
      <circle cx="50" cy="238" r="7" fill="#34d399" />
      <text x="69" y="245" fill="#a7f3d0" font-size="17" font-weight="680">
        Écriture active après GO
      </text>
    </g>

    <path
      d="M1328 593C1284 760 1012 782 797 730 582 678 336 710 280 586"
      fill="none"
      stroke="#f59e0b"
      stroke-dasharray="12 12"
      stroke-linecap="round"
      stroke-width="4"
      marker-end="url(#arrowAmber)"
    />
    <g transform="translate(630 688)" filter="url(#softShadow)">
      <rect width="340" height="76" rx="22" fill="#251a12" stroke="#f59e0b" />
      <path
        d="M29 39h22m-8-9 9 9-9 9"
        fill="none"
        stroke="#fbbf24"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="3"
      />
      <text x="68" y="33" fill="#fde68a" font-size="14" font-weight="800">
        TRAJET DE RETOUR
      </text>
      <text x="68" y="57" fill="#fff" font-size="20" font-weight="760">
        Répété avant la bascule
      </text>
    </g>

    <g transform="translate(86 817)">
      <line x1="0" y1="0" x2="1428" y2="0" stroke="#334155" stroke-width="2" />
      <text x="0" y="40" fill="#94a3b8" font-size="18">
        Le GO reste une décision humaine fondée sur des preuves datées.
      </text>
      <text
        x="1428"
        y="40"
        fill="#a5b4fc"
        font-size="18"
        font-weight="720"
        text-anchor="end"
      >
        ÉCRIRE ICI, OU LÀ — JAMAIS AUX DEUX ENDROITS
      </text>
    </g>
  </g>
</svg>
