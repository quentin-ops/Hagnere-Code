<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Contrat de test d’un MVP SaaS</title>
  <desc id="desc">Trois formats de test indépendants utilisent les sept familles de décisions avant une preuve et une décision humaine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#18112f"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#09090b"/>
  <circle cx="1420" cy="120" r="300" fill="#7c3aed" opacity="0.10"/>
  <circle cx="100" cy="820" r="260" fill="#0891b2" opacity="0.08"/>
  <path d="M0 210H1600M0 430H1600M0 650H1600" stroke="#ffffff" stroke-opacity="0.035"/>
  <path d="M220 0V900M560 0V900M900 0V900M1240 0V900" stroke="#ffffff" stroke-opacity="0.025"/>

  <text x="110" y="90" fill="#c4b5fd" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4">MVP SAAS · CONTRAT DE TEST</text>
  <text x="110" y="145" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="750">Choisir la frontière avant les fonctionnalités</text>
  <text x="110" y="188" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="23">Le format fixe la conclusion maximale ; les sept familles rendent le test exploitable.</text>

  <g filter="url(#shadow)">
    <rect x="110" y="250" width="350" height="135" rx="22" fill="#18181b" stroke="#52525b"/>
    <rect x="110" y="250" width="8" height="135" rx="4" fill="#71717a"/>
    <text x="145" y="292" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">FORMAT · PROTOTYPE</text>
    <text x="145" y="329" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Sans production</text>
    <text x="145" y="360" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="17">Répond à une incertitude ciblée</text>

    <rect x="625" y="250" width="350" height="135" rx="22" fill="#231942" stroke="#8b5cf6"/>
    <rect x="625" y="250" width="8" height="135" rx="4" fill="#8b5cf6"/>
    <text x="660" y="292" fill="#c4b5fd" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">FORMAT · PILOTE</text>
    <text x="660" y="329" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Accompagné et borné</text>
    <text x="660" y="360" fill="#c4b5fd" font-family="Inter, Arial, sans-serif" font-size="17">Quelques clients, équipe présente</text>

    <rect x="1140" y="250" width="350" height="135" rx="22" fill="#102a36" stroke="#22d3ee"/>
    <rect x="1140" y="250" width="8" height="135" rx="4" fill="#22d3ee"/>
    <text x="1175" y="292" fill="#a5f3fc" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">FORMAT · PREMIER CLIENT</text>
    <text x="1175" y="329" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">En production</text>
    <text x="1175" y="360" fill="#a5f3fc" font-family="Inter, Arial, sans-serif" font-size="17">Le client dépend du service</text>
  </g>

  <path d="M285 385V438" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 385V438" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1315 385V438" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="110" y="458" width="1380" height="245" rx="28" fill="#ffffff" fill-opacity="0.055" stroke="#ffffff" stroke-opacity="0.16"/>
  <text x="150" y="502" fill="#e4e4e7" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">SEPT FAMILLES · CINQ TRAITEMENTS POSSIBLES POUR CHACUNE</text>

  <g font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650">
    <g transform="translate(150 535)">
      <rect width="300" height="58" rx="15" fill="#8b5cf6" fill-opacity="0.20" stroke="#8b5cf6"/>
      <circle cx="29" cy="29" r="10" fill="#8b5cf6"/>
      <text x="52" y="36" fill="#ffffff">Parcours de valeur</text>
    </g>
    <g transform="translate(485 535)">
      <rect width="300" height="58" rx="15" fill="#8b5cf6" fill-opacity="0.15" stroke="#7c3aed"/>
      <circle cx="29" cy="29" r="10" fill="#8b5cf6"/>
      <text x="52" y="36" fill="#ffffff">Comptes et accès</text>
    </g>
    <g transform="translate(820 535)">
      <rect width="300" height="58" rx="15" fill="#0891b2" fill-opacity="0.16" stroke="#06b6d4"/>
      <circle cx="29" cy="29" r="10" fill="#22d3ee"/>
      <text x="52" y="36" fill="#ffffff">Données et continuité</text>
    </g>
    <g transform="translate(1155 535)">
      <rect width="295" height="58" rx="15" fill="#0891b2" fill-opacity="0.16" stroke="#06b6d4"/>
      <circle cx="29" cy="29" r="10" fill="#22d3ee"/>
      <text x="52" y="36" fill="#ffffff">Vente et droits</text>
    </g>
    <g transform="translate(235 620)">
      <rect width="300" height="58" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#71717a"/>
      <circle cx="29" cy="29" r="10" fill="#a1a1aa"/>
      <text x="52" y="36" fill="#ffffff">Aide et incidents</text>
    </g>
    <g transform="translate(650 620)">
      <rect width="300" height="58" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#71717a"/>
      <circle cx="29" cy="29" r="10" fill="#a1a1aa"/>
      <text x="52" y="36" fill="#ffffff">Admin. et exploitation</text>
    </g>
    <g transform="translate(1065 620)">
      <rect width="300" height="58" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#71717a"/>
      <circle cx="29" cy="29" r="10" fill="#a1a1aa"/>
      <text x="52" y="36" fill="#ffffff">Mesure et sortie</text>
    </g>
  </g>

  <path d="M800 703V752" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="260" y="772" width="1080" height="80" rx="24" fill="#6d28d9"/>
  <text x="800" y="807" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650">RÉSULTAT VENDU  →  ÉVÉNEMENT DE PREUVE  →  DÉCISION HUMAINE</text>
  <text x="800" y="836" text-anchor="middle" fill="#f5f3ff" font-family="Inter, Arial, sans-serif" font-size="16">Construire · Manuel · Intégrer · Reporter · À vérifier</text>
</svg>
